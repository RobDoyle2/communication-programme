<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--sf:#fff;--tx:#1d2420;--mu:#6a746d;--ln:#dcdad2;--ac:#0f766e;--ac2:#ccefe9;--ok:#dff3e4;--okt:#1e7a3c;--wk:#efede7;--sh:0 10px 40px rgba(0,0,0,.2)}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--sf:#1d2220;--tx:#e8ece9;--mu:#9aa59d;--ln:#333a36;--ac:#4fd1c0;--ac2:#18403b;--ok:#1b3324;--okt:#6fd48f;--wk:#191d1b;--sh:0 10px 40px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:1.25rem;margin:0;min-width:11ch}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button,.pill{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:5px 12px}
.nav button:disabled{opacity:.35;cursor:default}
#mt{min-width:9.5ch;text-align:center;font-weight:600}
#prog{color:var(--mu);font-size:.85rem}
main{flex:1 0 auto;display:flex;flex-direction:column;padding:0 12px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 0 4px;color:var(--mu);font-size:.8rem;text-align:center}
#grid{flex:1 0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.c{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0;overflow:hidden}
.c.x{visibility:hidden}.c.o{opacity:.4}
button.c:hover{border-color:var(--ac)}
.c.wk{background:var(--wk)}
.c .n{font-weight:600;font-size:.95rem;width:1.7em;height:1.7em;line-height:1.7em;text-align:center;border-radius:50%}
.c .l{white-space:nowrap;overflow:hidden;font-size:.72rem;color:var(--ac);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.c .t{font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c .r{font-size:.72rem;color:var(--mu);font-style:italic}
.c.today{border:2px solid var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.c.today .n{background:var(--ac);color:var(--bg)}
.c.done{background:var(--ok)}.c.done .l{color:var(--okt)}
.c.done::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--okt);font-weight:700}
.c.note::before{content:"";position:absolute;bottom:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--ac);width:var(--p,0)}
footer{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;font-size:.88rem;border-top:1px solid var(--ln);margin-top:8px;position:relative}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-weight:600;margin-right:2px}
footer .pill{font-size:.85rem;padding:3px 10px}
a.pill{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:4px}.pill:hover{border-color:var(--ac)}
.right{margin-left:auto}
details.more>summary{list-style:none;cursor:pointer}details.more>summary::-webkit-details-marker{display:none}
.menu{position:absolute;bottom:100%;right:12px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;box-shadow:var(--sh);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:250px;z-index:5}
.menu button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:6px}.menu button:hover{background:var(--ac2)}
#bk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);box-shadow:var(--sh);z-index:11;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:in .18s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;padding:12px 18px 0}.tabs button{background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:4px 14px;font-size:.9rem}.tabs button:first-child{border-color:var(--ac);color:var(--ac);font-weight:600}
.wd{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin-bottom:8px;position:relative}.wd:hover{border-color:var(--ac)}.wd .wl{color:var(--ac);font-size:.78rem;font-weight:600}.wd .wg{color:var(--mu);font-size:.88rem}.wd.dn{background:var(--ok)}.wd.dn::after{content:"✓";position:absolute;right:12px;top:8px;color:var(--okt);font-weight:700}
.ph{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--ln)}
.ph .s{color:var(--ac);font-weight:600;font-size:.85rem}.ph h2{margin:2px 0;font-size:1.3rem;line-height:1.25}.ph .m{color:var(--mu);font-size:.82rem}
.ph>button{margin-left:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px;width:36px;height:36px;flex:none}
.pb{flex:1;overflow:auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
.prg{color:var(--mu);font-size:.9rem;margin-bottom:10px}
.intro{background:var(--ac2);border-radius:10px;padding:2px 14px;margin-bottom:12px}
.tk{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.tk>header{padding:10px 12px;gap:8px;flex-wrap:nowrap;cursor:pointer}
.tk .tt{font-weight:600;flex:1}.tk .tm{color:var(--mu);font-size:.8rem}
.tk .ck{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:999px;padding:3px 12px;font-size:.85rem;white-space:nowrap}
.tk.done .ck{background:var(--ac);color:var(--bg)}
.tk .tb{padding:0 14px 6px;display:none}.tk.open .tb{display:block}
.tk.done{opacity:.75}
.tk .cv{transition:transform .15s;color:var(--mu)}.tk.open .cv{transform:rotate(180deg)}
.pb p{margin:.5em 0}.pb ul,.pb ol{margin:.4em 0;padding-left:1.4em}.pb li{margin:.15em 0}
.pb h4{margin:1em 0 .2em;color:var(--ac);font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
.pb blockquote{margin:.6em 0;padding:.2em 12px;border-left:3px solid var(--ac);color:var(--mu);font-style:italic}
p.ind{margin-left:1em;padding-left:10px;border-left:2px solid var(--ln)}
.tw{overflow-x:auto}table{border-collapse:collapse;margin:.6em 0;font-size:.9rem}td,th{border:1px solid var(--ln);padding:4px 10px;text-align:left}th{background:var(--ac2)}
details.gd{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 14px;margin:12px 0}details.gd summary{cursor:pointer;font-weight:600}
.nt{margin-top:16px}.nt label{font-weight:600;display:block;margin-bottom:4px}
.nt textarea{width:100%;min-height:130px;resize:vertical;font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.nt small{color:var(--mu)}
@media(max-width:640px){#grid,.dow{gap:3px}.c{padding:3px 4px;border-radius:7px}.c .t,.c .r{display:none}.c .l{font-size:.6rem;letter-spacing:0}.c .n{font-size:.8rem}header h1{font-size:1.05rem}.c.done::after{top:3px;right:4px;font-size:.8rem}}
</style>
</head>

ce three ways."}]},{"title":"Skill","mins":"3 min","blocks":[{"t":"p","x":"Experiment with:"},{"t":"li","x":"pace;"},{"t":"li","x":"emphasis;"},{"t":"li","x":"energy."}]},{"title":"Drill","mins":"5 min","blocks":[{"t":"p","x":"Say:"},{"t":"p","x":"“I don't think that's going to work.”"},{"t":"p","x":"As:"},{"t":"li","x":"uncertain;"},{"t":"li","x":"concerned;"},{"t":"li","x":"firm;"},{"t":"li","x":"amused;"},{"t":"li","x":"reassuring."}]},{"title":"Application","mins":"3 min","blocks":[{"t":"p","x":"Give a one-minute explanation."}]},{"title":"Review","mins":"2 min","blocks":[{"t":"p","x":"Did I sound engaged?"}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":2,"weekName":"Emphasis and vocal clarity","weekIntro":[],"g":2},{"date":"2026-10-16","kind":"day","n":10,"label":"Day 10","title":"Short Story","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Read aloud."}]},{"title":"Skill","mins":"3 min","blocks":[{"t":"p","x":"Use:"},{"t":"p","x":"Something happened → Reaction → Point"}]},{"title":"Drill","mins":"5 min","blocks":[{"t":"p","x":"Tell three 30-second stories."}]},{"title":"Application","mins":"3 min","blocks":[{"t":"p","x":"Tell one two-minute story."}]},{"title":"Review","mins":"2 min","blocks":[{"t":"p","x":"What was the most interesting moment?"}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":2,"weekName":"Emphasis and vocal clarity","weekIntro":[],"g":2},{"date":"2026-10-19","kind":"day","n":11,"label":"Day 11","title":"Answer First","intro":[{"t":"p","x":"Today's goal: Give the listener your main point before explaining the background."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Read these opening phrases aloud three times:"},{"t":"li","x":"“The short answer is…”"},{"t":"li","x":"“My main point is…”"},{"t":"li","x":"“I would recommend…”"},{"t":"li","x":"“The biggest issue is…”"},{"t":"li","x":"“I think we should…”"},{"t":"p","x":"After each phrase, complete the sentence with a simple idea."},{"t":"p","x":"For example: “The biggest issue is that we don't have enough time.”"}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"When someone asks you a question, you may start explaining the background while you work out your answer. The listener then has to wait for the point."},{"t":"p","x":"Instead, give the answer first. Add the explanation afterwards."},{"t":"p","x":"Use this structure:"},{"t":"p","x":"Answer → Reason → Example"},{"t":"p","x":"For example:"},{"t":"p","x":"Question: “Do you think we should change the project plan?”"},{"t":"p","x":"Answer: “Yes, I think we should.”"},{"t":"p","x":"Reason: “The current plan leaves too little time for testing.”"},{"t":"p","x":"Example: “Last time, we found several problems during the final week.”"},{"t":"p","x":"You don't need all three parts every time. Use only what helps the listener."}]},{"title":"Speaking drill","mins":"5 min","blocks":[{"t":"p","x":"Answer these five questions. Allow about 30–40 seconds for each."},{"t":"ol","n":1,"x":"What makes a good manager?"},{"t":"ol","n":2,"x":"What is the most important part of your job?"},{"t":"ol","n":3,"x":"What makes a conversation enjoyable?"},{"t":"ol","n":4,"x":"What is something you would like to learn?"},{"t":"ol","n":5,"x":"What makes someone a good friend?"},{"t":"p","x":"For every answer:"},{"t":"ol","n":1,"x":"Start with “The short answer is…” or “I think…”"},{"t":"ol","n":2,"x":"State your answer in the first sentence."},{"t":"ol","n":3,"x":"Give one reason."},{"t":"ol","n":4,"x":"Stop when you've made your point."},{"t":"p","x":"Don't restart an answer because the wording wasn't perfect."}]},{"title":"Real-life application","mins":"5 min","blocks":[{"t":"p","x":"Think of a question you might realistically be asked at work this week."},{"t":"p","x":"For example:"},{"t":"li","x":"“What's the current status?”"},{"t":"li","x":"“What's the problem?”"},{"t":"li","x":"“What do you recommend?”"},{"t":"li","x":"“Do we need to change the plan?”"},{"t":"p","x":"Answer it aloud twice."},{"t":"p","x":"First attempt: Answer naturally."},{"t":"p","x":"Second attempt: Give the answer in your first sentence, then explain."},{"t":"p","x":"If you have time, record the second attempt and listen back. Could someone understand your position within the first five seconds?"}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I answer before explaining?"},{"t":"li","x":"Did I add unnecessary background?"},{"t":"li","x":"Did the answer sound more confident when I led with the point?"},{"t":"p","x":"Today's takeaway: Write one sentence describing what you want to remember."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In one conversation today, give your answer before explaining your reasoning."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-20","kind":"day","n":12,"label":"Day 12","title":"Five-Second Start","intro":[{"t":"p","x":"Today's goal: Begin speaking without waiting for the perfect opening."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a familiar subject, such as your weekend, your work or a hobby."},{"t":"p","x":"Speak about it for 30 seconds."},{"t":"p","x":"Don't prepare notes. Just start."},{"t":"p","x":"Now choose another subject and begin within five seconds."},{"t":"p","x":"Notice the difference between preparing endlessly and simply getting started."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Sometimes the difficulty isn't knowing what to say. It's finding the first sentence."},{"t":"p","x":"You may try to construct the entire answer in your head before opening your mouth. That creates pressure and can make spontaneous speaking harder."},{"t":"p","x":"Today, practise starting with a simple, useful sentence. You can develop the thought after you begin."},{"t":"p","x":"Use one of these openings:"},{"t":"li","x":"“My first thought is…”"},{"t":"li","x":"“I think the main issue is…”"},{"t":"li","x":"“One example that comes to mind is…”"},{"t":"li","x":"“The way I see it…”"},{"t":"li","x":"“Something I've noticed is…”"},{"t":"p","x":"These are starting points, not phrases you must use every time."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Complete five rounds."},{"t":"p","x":"For each round:"},{"t":"ol","n":1,"x":"Read the question."},{"t":"ol","n":2,"x":"Give yourself no more than five seconds."},{"t":"ol","n":3,"x":"Start speaking."},{"t":"ol","n":4,"x":"Continue for approximately 40–45 seconds."},{"t":"ol","n":5,"x":"Pause briefly before the next round."},{"t":"p","x":"Questions:"},{"t":"ol","n":1,"x":"What makes a workplace enjoyable?"},{"t":"ol","n":2,"x":"What is something you have learned from experience?"},{"t":"ol","n":3,"x":"What makes a person interesting?"},{"t":"ol","n":4,"x":"What would you change about how meetings are run?"},{"t":"ol","n":5,"x":"What is something you enjoy doing outdoors?"},{"t":"p","x":"After the five rounds, choose one question and answer it again for 60 seconds."},{"t":"p","x":"Don't aim for a brilliant answer. Aim for a clear beginning and a complete thought."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Imagine that a colleague asks you unexpectedly:"},{"t":"q","x":"“What do you think we should do about this?”"},{"t":"p","x":"Choose a real or imaginary work issue."},{"t":"p","x":"Give yourself five seconds, then respond for one minute."},{"t":"p","x":"Repeat the exercise with a social question:"},{"t":"q","x":"“What have you been up to lately?”"},{"t":"p","x":"Practise giving a straightforward answer that includes one interesting detail."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I wait for a perfect opening?"},{"t":"li","x":"Did the first sentence become easier after a few rounds?"},{"t":"li","x":"Did I discover that I could develop the thought once I started?"},{"t":"p","x":"Today's takeaway: “I can start simply and develop the answer as I speak.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"When someone asks for your opinion today, try to begin within five seconds rather than mentally rehearsing a complete response."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-21","kind":"day","n":13,"label":"Day 13","title":"Finding Words and Recovering Smoothly","intro":[{"t":"p","x":"Today's goal: Keep communicating when the words don't come easily."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose an everyday object near you."},{"t":"p","x":"Describe it without naming it."},{"t":"p","x":"For example, if the object is a mug:"},{"t":"q","x":"“It's something you drink from. It usually has a handle. You might use it for coffee or tea.”"},{"t":"p","x":"Repeat with two other objects."},{"t":"p","x":"This trains you to explain an idea even when the exact word isn't immediately available."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Good communicators don't always find the perfect word immediately. They know how to recover and continue."},{"t":"p","x":"If you get stuck, don't panic or abandon the sentence. Try one of these phrases:"},{"t":"li","x":"“What I mean is…”"},{"t":"li","x":"“Let me put that more simply.”"},{"t":"li","x":"“The point I'm getting at is…”"},{"t":"li","x":"“Another way to explain it is…”"},{"t":"li","x":"“Let me start that thought again.”"},{"t":"p","x":"Use these phrases naturally. You don't need to apologise for every hesitation."},{"t":"p","x":"The objective is to recover without losing the main point."}]},{"title":"Speaking drill","mins":"5–6 min","blocks":[{"t":"p","x":"Exercise A — Explain another way"},{"t":"p","x":"Complete these five examples aloud:"},{"t":"ol","n":1,"x":"“The project is difficult because…” Explain the same problem in a simpler way."},{"t":"ol","n":2,"x":"“The main risk is…” Give a concrete example."},{"t":"ol","n":3,"x":"“What I'm trying to say is…” Finish the thought in plain English."},{"t":"ol","n":4,"x":"“Another way to look at it is…” Offer a different perspective."},{"t":"ol","n":5,"x":"“Let me put that more simply…” Explain a technical concept to a nontechnical person."},{"t":"p","x":"Allow about 45 seconds per example."},{"t":"p","x":"Exercise B — Recover"},{"t":"p","x":"Choose two of the examples."},{"t":"p","x":"Halfway through each answer, deliberately pause and say:"},{"t":"q","x":"“Let me put that another way.”"},{"t":"p","x":"Then continue with a simpler explanation."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Choose a topic you know well."},{"t":"p","x":"Explain it for one minute without notes."},{"t":"p","x":"If you get stuck:"},{"t":"ol","n":1,"x":"Pause."},{"t":"ol","n":2,"x":"Identify the point you were trying to make."},{"t":"ol","n":3,"x":"Use a recovery phrase."},{"t":"ol","n":4,"x":"Continue."},{"t":"p","x":"Repeat the explanation once, aiming to make it clearer rather than more elaborate."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"What do I normally do when I cannot find a word?"},{"t":"li","x":"Did I recover rather than ramble?"},{"t":"li","x":"Which recovery phrase felt most natural?"},{"t":"p","x":"Today's takeaway: “I don't need the perfect word to keep communicating.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"If you lose a word or stumble over a sentence today, pause and explain the idea another way instead of rushing to rescue the original sentence."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-22","kind":"day","n":14,"label":"Day 14","title":"Three Levels: 20 Seconds, 60 Seconds, 2 Minutes","intro":[{"t":"p","x":"Today's goal: Control how much you say without losing the main point."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a familiar subject, such as your job, a hobby or a recent event."},{"t":"p","x":"Explain it in one sentence."},{"t":"p","x":"Now explain it in three sentences."},{"t":"p","x":"Notice how you can communicate the same basic idea at different levels of detail."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"A good communicator doesn't give the same-length answer to every question."},{"t":"p","x":"Sometimes the listener needs a quick answer. Sometimes they want an explanation. Sometimes they need the full picture."},{"t":"p","x":"Your job is to choose the appropriate level of detail."},{"t":"p","x":"Think of three versions:"},{"t":"li","x":"20 seconds: The headline and essential point."},{"t":"li","x":"60 seconds: The point plus the reason and one example."},{"t":"li","x":"2 minutes: A fuller explanation, including relevant context and consequences."},{"t":"p","x":"The longer version should add useful detail, not simply repeat the same idea in more words."}]},{"title":"Speaking drill","mins":"6–7 min","blocks":[{"t":"p","x":"Choose one subject. Good options include:"},{"t":"li","x":"What you do in your job."},{"t":"li","x":"A project you're working on."},{"t":"li","x":"A hobby you enjoy."},{"t":"li","x":"A place you've visited."},{"t":"li","x":"Something you believe makes life better."},{"t":"p","x":"Explain the same subject at all three lengths."},{"t":"p","x":"Round 1 — 20 seconds"},{"t":"p","x":"Give only the essential message."},{"t":"p","x":"Round 2 — 60 seconds"},{"t":"p","x":"Add the main reason and an example."}]},{"title":"Round 3","mins":"2 min","blocks":[{"t":"p","x":"Develop the explanation with relevant background, a specific detail and a conclusion."},{"t":"p","x":"If you finish before the time is up, don't add filler. Finish naturally and use the remaining time to prepare the next version."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Choose a current work topic."},{"t":"p","x":"Imagine three listeners:"},{"t":"ol","n":1,"x":"A busy senior manager."},{"t":"ol","n":2,"x":"A colleague who needs to understand the issue."},{"t":"ol","n":3,"x":"Someone who needs the full explanation to make a decision."},{"t":"p","x":"Give each version aloud."},{"t":"p","x":"For the senior manager, lead with the outcome or decision."},{"t":"p","x":"For the colleague, explain the reasoning."},{"t":"p","x":"For the person making the decision, include the relevant detail and consequences."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"What detail did I remove from the 20-second version?"},{"t":"li","x":"What did I add to the two-minute version?"},{"t":"li","x":"Did the main point remain the same?"},{"t":"li","x":"Did I add detail because it was useful or simply because I had more to say?"},{"t":"p","x":"Today's takeaway: “I can change the length without losing the message.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Before explaining something at work, consider how much detail the listener actually needs. Start with the short version and expand if necessary."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-23","kind":"day","n":15,"label":"Day 15","title":"Answer the Actual Question","intro":[{"t":"p","x":"Today's goal: Listen to the question, identify what is being asked, and answer that question directly."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Read these questions aloud:"},{"t":"li","x":"“What happened?”"},{"t":"li","x":"“Why did it happen?”"},{"t":"li","x":"“What should we do?”"},{"t":"li","x":"“When will it be finished?”"},{"t":"li","x":"“What do you recommend?”"},{"t":"p","x":"Give a one-sentence answer to each."},{"t":"p","x":"Notice that each question asks for something different."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Sometimes a question contains background, several details or an expression of concern. It's easy to respond to the general topic rather than the actual question."},{"t":"p","x":"Before answering, silently ask:"},{"t":"q","x":"“What are they actually asking me?”"},{"t":"p","x":"Identify whether they want:"},{"t":"li","x":"A fact."},{"t":"li","x":"An explanation."},{"t":"li","x":"A recommendation."},{"t":"li","x":"A decision."},{"t":"li","x":"Reassurance."},{"t":"li","x":"A next step."},{"t":"p","x":"Answer that first. Add supporting detail only when it helps."},{"t":"p","x":"For example:"},{"t":"p","x":"Question: “Given the testing delays and the supplier issue, do you think we can still deliver by Friday?”"},{"t":"p","x":"Less direct answer: “Well, we've had a few problems with testing, and the supplier has been slow…”"},{"t":"p","x":"More direct answer: “Friday is possible, but it's at risk because of the supplier delay.”"},{"t":"p","x":"Now the listener knows your position. You can explain the details afterwards."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer these five questions."},{"t":"p","x":"Before each answer, pause for two seconds and silently identify the actual question."},{"t":"p","x":"Question 1: “What is the biggest risk to the project?”"},{"t":"p","x":"Answer with the main risk."},{"t":"p","x":"Question 2: “Why has the work fallen behind?”"},{"t":"p","x":"Give the cause, not a full history of the project."},{"t":"p","x":"Question 3: “What would you recommend?”"},{"t":"p","x":"Give your recommendation first."},{"t":"p","x":"Question 4: “Can you finish this by Friday?”"},{"t":"p","x":"Give a clear yes, no or qualified answer."},{"t":"p","x":"Question 5: “What do you need from me?”"},{"t":"p","x":"State the specific help or decision required."},{"t":"p","x":"Allow about 45–60 seconds for each, including a brief pause before answering."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Think of a recent meeting or conversation in which you explained a lot but may not have answered the question directly."},{"t":"p","x":"Reconstruct the exchange."},{"t":"p","x":"Ask yourself:"},{"t":"ol","n":1,"x":"What did the person actually want to know?"},{"t":"ol","n":2,"x":"What did I answer instead?"},{"t":"ol","n":3,"x":"What would a direct first sentence have sounded like?"},{"t":"p","x":"Now role-play the exchange aloud."},{"t":"p","x":"Give the direct answer first, followed by one reason or example if necessary."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I identify the question before answering?"},{"t":"li","x":"Did I answer directly in my first sentence?"},{"t":"li","x":"Did I confuse explaining the background with answering the question?"},{"t":"li","x":"What will I do differently next time?"},{"t":"p","x":"Today's takeaway: “Answer the question first. Explain only what is needed.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In a meeting today, answer the question that was asked — not the question you prepared for."},{"t":"p","x":"If the question is unclear, ask:"},{"t":"q","x":"“Do you mean the current status, or whether I think we'll meet the deadline?”"},{"t":"p","x":"Clarifying the question is better than giving a long answer to the wrong one."}]},{"title":"Week 3 — End-of-week review","mins":null,"blocks":[{"t":"p","x":"Allow 5 minutes on Friday if you have time, or use this as a brief reflection after the daily session."},{"t":"p","x":"Look back at the five skills:"},{"t":"li","x":"Answer First."},{"t":"li","x":"Five-Second Start."},{"t":"li","x":"Finding Words."},{"t":"li","x":"Three Levels."},{"t":"li","x":"Answer the Actual Question."},{"t":"p","x":"Complete these sentences:"},{"t":"p","x":"The skill that came most naturally was…"},{"t":"p","x":"The skill I found most difficult was…"},{"t":"p","x":"One thing I noticed about how I speak is…"},{"t":"p","x":"One thing I will practise in real conversations next week is…"},{"t":"p","x":"This week's key lesson"},{"t":"p","x":"You don't need to think of the whole answer before you start speaking."},{"t":"p","x":"You need to know your first point, begin simply, and develop the thought in manageable pieces."},{"t":"q","x":"Start with the point. Keep going one thought at a time. Recover when needed. Stop when you've answered."},{"t":"p","x":"That's how you make spontaneous speaking clearer, calmer and more natural."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-26","kind":"day","n":16,"label":"Day 16","title":"Strong Openings","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say aloud three times: “My main point is…” Follow it with a clear, one-sentence point. Pause and finish firmly."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Point → Reason → Example."},{"t":"p","x":"Instead of: “I was looking at the project, and there are a few things that might be worth considering…”"},{"t":"p","x":"Say: “We need to review the project timeline. Testing is taking longer than expected.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose three work topics. For each one:"},{"t":"li","x":"State your main point in one sentence."},{"t":"li","x":"Give one reason."},{"t":"li","x":"Add an example if needed."},{"t":"li","x":"Stop and pause."},{"t":"p","x":"Repeat your clearest answer, making the first sentence more direct."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Prepare a 30-second contribution to a meeting. Start with your main point, support it with one reason and finish clearly. Practise twice, using shorter sentences the second time."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Did I get to the point quickly? Was my first sentence clear? Did I finish confidently?"},{"t":"p","x":"Today’s takeaway: Lead with the point, not the background."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Start one real conversation or work contribution with your main point."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-27","kind":"day","n":17,"label":"Day 17","title":"Don’t Give Away the Floor","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say three short statements aloud. After each, pause briefly without trailing off or looking as though you have finished speaking."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Your voice can drop at the end of a sentence, making others think you have finished. Keep the final words audible and deliberate. When you have more to say, use a linking phrase such as “The other point is…”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Practise these phrases:"},{"t":"li","x":"“There’s one important point.”"},{"t":"li","x":"“The reason I say that is…”"},{"t":"li","x":"“The second issue is…”"},{"t":"li","x":"“What I recommend is…”"},{"t":"p","x":"After each opening, continue with a complete thought. Keep your voice steady and finish each sentence clearly."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Explain a work issue in three short sentences. Pause between sentences, but make it clear you are continuing. Finish with a definite conclusion, such as: “That’s why I recommend delaying the decision.”"}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Did my voice remain audible at the end? Did I signal when I had more to say? Did I finish deliberately?"},{"t":"p","x":"Today’s takeaway: A pause does not have to mean you have finished."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In one conversation, keep the floor long enough to complete your point instead of letting your voice fade or stopping mid-thought."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-28","kind":"day","n":18,"label":"Day 18","title":"Handling Interruptions","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say aloud, calmly and clearly:"},{"t":"li","x":"“Let me finish that point.”"},{"t":"li","x":"“Just to complete the thought…”"},{"t":"li","x":"“I’ll come to that in a moment.”"},{"t":"p","x":"Repeat each phrase twice without sounding aggressive."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"When interrupted, you do not have to compete by speaking louder or faster. Briefly acknowledge the other person, then return to your point."},{"t":"p","x":"Use: Acknowledge → Return → Finish."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Practise responding to these imagined interruptions:"},{"t":"li","x":"“But what about the cost?”"},{"t":"li","x":"“We tried that before.”"},{"t":"li","x":"“Can I just ask something?”"},{"t":"p","x":"Acknowledge each interruption briefly, then say, “The point I was making is…” and finish your original thought in one or two sentences."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Imagine a meeting where you need to explain a project risk. Speak for 30 seconds. Pause at a planned point and imagine someone interrupts."},{"t":"p","x":"Respond calmly, return to your main message and finish with your recommendation. Repeat twice, keeping your answer concise."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Did I stay calm? Did I return to my original point? Did I avoid overexplaining?"},{"t":"p","x":"Today’s takeaway: You can acknowledge an interruption without abandoning your point."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"If interrupted today, calmly return to your main point and complete it."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-29","kind":"day","n":19,"label":"Day 19","title":"Disagreeing Clearly","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say each phrase aloud:"},{"t":"li","x":"“I see it differently.”"},{"t":"li","x":"“I understand that concern, but…”"},{"t":"li","x":"“My main concern is…”"},{"t":"li","x":"“I recommend another approach.”"},{"t":"p","x":"Keep your tone calm and your sentences short."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Acknowledge → Disagree → Reason → Alternative."},{"t":"p","x":"Example: “I understand why we want to release this week. My concern is that testing is incomplete. I recommend waiting until Friday.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Practise disagreeing with these statements:"},{"t":"li","x":"“We don’t need more testing.”"},{"t":"li","x":"“We should make the decision now.”"},{"t":"li","x":"“The current process is good enough.”"},{"t":"p","x":"For each one, acknowledge the view, state your concern, give one reason and suggest an alternative."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a real or imagined work disagreement. Deliver your response in three or four sentences. Repeat it, removing unnecessary qualifications such as “I might be wrong, but perhaps…”"},{"t":"p","x":"Be respectful without hiding your position."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Was my position clear? Did I explain why? Did I offer a constructive alternative?"},{"t":"p","x":"Today’s takeaway: Respectful disagreement can be direct. You do not need to bury your point in apologies or qualifications."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"State one genuine preference or concern clearly today, while acknowledging the other person’s perspective."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-30","kind":"day","n":20,"label":"Day 20","title":"Month 1 Test","intro":[{"t":"p","x":"Weekly objective: Bring together clear openings, short sentences, audible endings and the ability to hold your turn."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say: “My main point is…” Then give a clear point about a work topic. Repeat with a different topic."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Remember the four habits from Month 1:"},{"t":"li","x":"One thought per sentence."},{"t":"li","x":"Pause between thoughts."},{"t":"li","x":"Keep the end of each sentence audible."},{"t":"li","x":"State the main point early."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Record yourself answering these three questions:"},{"t":"ol","n":1,"x":"What is an important issue in your work?"},{"t":"ol","n":2,"x":"What do you recommend?"},{"t":"ol","n":3,"x":"Why do you recommend it?"},{"t":"p","x":"Speak for approximately 30–45 seconds per answer. Use short sentences and finish each answer clearly."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose one answer and repeat it, improving the weakest part of your delivery. Then practise an interruption: pause, acknowledge the imagined speaker, return to your point and finish."},{"t":"p","x":"If you attend Toastmasters or have a work meeting coming up, choose one habit to practise there."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Score yourself from 1 to 5 on:"},{"t":"li","x":"Clear opening."},{"t":"li","x":"Short sentences."},{"t":"li","x":"Audible sentence endings."},{"t":"li","x":"Holding the floor."},{"t":"li","x":"Direct, respectful disagreement."},{"t":"p","x":"Write down one improvement and one skill to continue practising."},{"t":"p","x":"Today’s takeaway: Being heard starts with making your message easy to follow and making it clear when you have more to say."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use one Month 1 skill in a real conversation today."}]},{"title":"Week 4 review","mins":null,"blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Do I get to the point more quickly?"},{"t":"li","x":"Do I finish sentences clearly?"},{"t":"li","x":"Can I hold my turn without rushing?"},{"t":"li","x":"Can I return to my point after an interruption?"},{"t":"li","x":"Can I disagree without hiding my position?"}]},{"title":"Toastmasters connection","min . Stop when you have said enough."}],"g":5},{"date":"2026-11-06","kind":"day","n":25,"label":"Day 25","title":"Work Answers — Weekly Review","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say aloud: “My recommendation is…”, “The reason is…” and “For example…” Pause between each phrase and finish clearly."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Bring the week together:"},{"t":"p","x":"Headline → Reason → Example → Stop"},{"t":"p","x":"You do not need all four parts every time. Use what the question requires."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer these questions in no more than 30 seconds each:"},{"t":"li","x":"What is the current status?"},{"t":"li","x":"What is the biggest risk?"},{"t":"li","x":"What do you recommend?"},{"t":"p","x":"Then answer: “Why?” and “Can you give me an example?” directly, without repeating your whole explanation."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a real work issue. Give a one-minute explanation using the four-part structure. Then practise answering two follow-up questions in one or two sentences each."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Score yourself from 1 to 5 on giving the headline first, keeping sentences short, explaining your reason, using examples and finishing clearly."},{"t":"p","x":"Today’s takeaway: A direct answer gives people a clear starting point; reasons and examples help them understand it."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use the week’s structure in one genuine work conversation."}]},{"title":"Week 5 review","mins":null,"blocks":[{"t":"li","x":"Do I start with the answer rather than the background?"},{"t":"li","x":"Can I explain an issue in 30 seconds?"},{"t":"li","x":"Do I give clear reasons and useful examples?"}]},{"title":"Toastmasters connection","mins":null,"blocks":[{"t":"p","x":"Notice how experienced speakers answer questions. Listen for who gives the main point first."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":5,"weekName":"Direct Answers","weekIntro":[{"t":"p","x":"Weekly objective: Give your main point first, then add only the explanation needed. This will help you communicate more clearly in meetings and everyday conversations."},{"t":"p","x":"Core principle: Answer first. Explain second. Stop when you have said enough."}],"g":5},{"date":"2026-11-09","kind":"day","n":26,"label":"Day 26","title":"Two Points","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say: “There are two things worth mentioning.” Give two short points about your work or day, pausing between them."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Headline → Point 1 → Point 2."},{"t":"p","x":"Example: “The project is progressing well. The main concern is the testing schedule.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain three topics using exactly two points: a project’s progress, what makes a good meeting, and something you enjoy. Give a headline, state each point separately and finish."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Prepare a 30–45 second explanation of a current work issue. Use two points only. If you are interrupted, answer briefly and return to your second point."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Were the points distinct? Did I finish one before starting the next? Did I avoid adding extra thoughts?"},{"t":"p","x":"Today’s takeaway: Two clear points are better than several loosely connected ones."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use “There are two things to consider” in a real conversation."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-10","kind":"day","n":27,"label":"Day 27","title":"Three Points","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say: “There are three things to consider.” Give three short points about a familiar subject."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Headline → First → Second → Third → Conclusion."},{"t":"p","x":"Example: “We need to finish testing, confirm support arrangements and agree the release date. Once those are complete, we can make a reliable decision.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain how to prepare for a meeting, reduce project risk and make a presentation clearer. Choose three points before speaking and summarise them at the end."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Write three keywords about a current work issue. Use them to speak for one minute without a script. Finish with a recommendation or next step."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did I know my points before speaking? Were they easy to distinguish? Did my conclusion connect them?"},{"t":"p","x":"Today’s takeaway: A simple structure gives your thoughts somewhere to go."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Explain one work issue using three clearly separated points."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-11","kind":"day","n":28,"label":"Day 28","title":"Signposting","intro":[]," tence about each."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use this quick planning method:"},{"t":"ol","n":1,"x":"Centre: What is the subject?"},{"t":"ol","n":2,"x":"Branches: What are the two or three key aspects?"},{"t":"ol","n":3,"x":"Message: What should the listener understand or do?"},{"t":"p","x":"Prepare keywords, not a complete script."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose a work topic, a skill you have developed and a personal interest. For each, take 20 seconds to choose three keywords, then speak for 45 seconds using them as prompts."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a work issue and write no more than five keywords, such as Problem → Cause → Risk → Options → Recommendation. Speak for one minute, then repeat using only three keywords."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did the keywords help me stay on track? Did I avoid scripting every sentence? Did I leave out unnecessary details?"},{"t":"p","x":"Today’s takeaway: Prepare the route, not every word of the journey."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use three mental keywords before making a contribution in a meeting."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-13","kind":"day","n":30,"label":"Day 30","title":"One-Minute Explanation — Weekly Review","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Explain a familiar topic in 20 seconds. Repeat with a headline, two or three points and a clear ending."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use this on le speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-16","kind":"day","n":31,"label":"Day 31","title":"Lost Thread","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Speak for 30 seconds about a familiar topic. Pause deliberately halfway through, then continue with your next point."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"When you lose your thread, do not rush or restart. Pause and ask yourself: “What is the main point I want to make?”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain three familiar topics for 30 seconds each. Deliberately pause once during each explanation. Resume with “The main point is…” or “What matters here is…”"}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Explain a work issue using three keywords. If you lose your place, pause, look at the keywords and continue with the next point. Repeat using a different topic."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did I recover without rushing? Did I return to the main point?"},{"t":"p","x":"Today’s takeaway: Losing your thread is manageable; you do not need to start again."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"If you lose your place today, pause and resume with your main point."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":7,"weekName":"Recovering Your Thread","weekIntro":[{"t":"p","x":"Weekly objective: Stay focused when you lose your words, simplify your explanation and recover calmly from unexpected questions."},{"t":"p","x":"Core principle: Pause. Find the main point. Continue from there."}],"g":7},{"date":"2026-11-17","kind":"day","n":32,"lab ng ."},{"t":"p","x":"What did they learn about me?"},{"t":"p","x":"House, kids, gorey. From cahersiveen. Like coffee. kayaking in Switzerland. I'm thinking of an electric car."},{"t":"p","x":"Interesting in that I miss listened than talked, specially on the way down to the barrow."}]},{"title":"Baseline score","mins":null,"blocks":[{"t":"p","x":"Give yourself Bad 1–5 Good for:"},{"t":"p","x":"Baseline 1-3, 4"},{"t":"li","x":"Clear main point 2, 4"},{"t":"li","x":"Sentence length 3. 3"},{"t":"li","x":"Pausing 4, 3"},{"t":"li","x":"Emphasis 2, 4"},{"t":"li","x":"Sentence endings 1,3"},{"t":"li","x":"Volume 2, 3"},{"t":"li","x":"Finding words 2, 4"},{"t":"li","x":"Staying on track 2, 3"},{"t":"li","x":"Avoiding rambling 4, 3"},{"t":"li","x":"Answering the actual question 2, 4"},{"t":"li","x":"Listening na, 4"},{"t":"li","x":"Conversation na, 4"},{"t":"li","x":"Confidence 1, 4"},{"t":"li","x":"Interesting/engaging 1, 4"},{"t":"p","x":"Don't worry about the scores."},{"t":"p","x":"They're simply your starting line."}]}]},{"id":"g-prep","title":"Goodman: Intro + Chapter 1","group":"prep","blocks":[{"t":"h","x":"Goodman section"},{"t":"p","x":"Introduction + Chapter 1: Begin with a Crystal Clear Mind"},{"t":"h","x":"Why listen now"},{"t":"p","x":"This is the right starting point because Goodman begins with getting your thoughts clear before worrying about delivery."},{"t":"p","x":"That fits your own problem particularly well: sometimes you have a good idea but formulate too much of it before speaking."},{"t":"h","x":"Listen for"},{"t":"li","x":"What exactly am I trying to say?"},{"t":"li","x":"What is my main point?"},{"t":"li","x":"What is getting in the way of saying it?"},{"t":"li","x":"Am I thinking about myself too much?"},{"t":"li","x":"Am I thinking clearly before I speak?"},{"t":"h","x":"Apply it"},{"t":"p","x":"Before your baseline recording, ask:"},{"t":"p","x":"\"If the listener remembers only one thing, what do I want it to be?\""},{"t":"p","x":"That question becomes one of the foundations of the whole six-month programme."}]},{"id":"journey","title":"Your six-month journey","group":"ref","blocks":[{"t":"tbl","rows":[["Stage","Main Question"],["Month 1","Can people understand me easily?"],["Month 2","Can I organise my thoughts while speaking?"],["Month 3","Can I enter a conversation and hold the floor?"],["Month 4","Can I properly understand the person I'm talking to?"],["Month 5","Can I adapt my communication to the person and situation?"],["Month 6","Do people get to know the interesting person behind the information?"]]}]},{"id":"rules","title":"The five rules to carry forward","group":"ref","blocks":[{"t":"ol","n":1,"x":"SAY THE POINT EARLY. Don't make people wait for it."},{"t":"ol","n":2,"x":"ONE THOUGHT. ONE SENTENCE. PAUSE. Shorter is usually easier to understand."},{"t":"ol","n":3,"x":"FINISH. Don't let your voice disappear at the end."},{"t":"ol","n":4,"x":"LISTEN BEFORE SOLVING. Work out what the person actually wants."},{"t":"ol","n":5,"x":"BE INTERESTED, NOT IMPRESSIVE. Ask good questions."},{"t":"p","x":"Listen to the answers."},{"t":"p","x":"Reveal something about yourself."},{"t":"p","x":"Tell the occasional story."},{"t":"p","x":"Have opinions."},{"t":"p","x":"Show emotion."},{"t":"p","x":"That's where the interesting person emerges."}]},{"id":"realworld","title":"The real-world rule","group":"ref","blocks":[{"t":"p","x":"The daily 15–20 minutes is your training."},{"t":"p","x":"Real conversations are your practice ground."},{"t":"p","x":"Use the skill:"},{"t":"li","x":"at work;"},{"t":"li","x":"with your family;"},{"t":"li","x":"at your club;"},{"t":"li","x":"at Toastmasters;"},{"t":"li","x":"with friends;"},{"t":"li","x":"with people you have just met."},{"t":"p","x":"Don't judge every conversation as a performance."},{"t":"p","x":"Instead ask:"},{"t":"p","x":"“Did I deliberately practise the skill?”"},{"t":"p","x":"If yes, the day counts."}]},{"id":"toast","title":"Toastmasters through the programme","group":"ref","blocks":[{"t":"p","x":"You don't need to turn every Toastmasters meeting into another assignment."},{"t":"p","x":"Use it as a laboratory."},{"t":"p","x":"Early months"},{"t":"p","x":"Ask for feedback on:"},{"t":"li","x":"clarity;"},{"t":"li","x":"sentence length;"},{"t":"li","x":"pace;"},{"t":"li","x":"endings;"},{"t":"li","x":"main point."},{"t":"p","x":"Middle months"},{"t":"p","x":"Ask about:"},{"t":"li","x":"structure;"},{"t":"li","x":"confidence;"},{"t":"li","x":"holding attention;"},{"t":"li","x":"handling questions;"},{"t":"li","x":"naturalness."},{"t":"p","x":"Later months"},{"t":"p","x":"Ask about:"},{"t":"li","x":"personality;"},{"t":"li","x":"storytelling;"},{"t":"li","x":"emotional range;"},{"t":"li","x":"humour;"},{"t":"li","x":"genuine interest;"},{"t":"li","x":"memorability."},{"t":"p","x":"A particularly useful question is:"},{"t":"p","x":"“What was the one moment that was most engaging?”"},{"t":"p","x":"And another:"},{"t":"p","x":"“Where did I lose you?”"},{"t":"p","x":"Those answers will tell you much more than simply hearing:"},{"t":"p","x":"“Good speech.”"}]},{"id":"final","title":"Final reminder","group":"ref","blocks":[{"t":"p","x":"You are not trying to become somebody else."},{"t":"p","x":"You already have useful strengths:"},{"t":"p","x":"thoughtfulness, consideration, logic, knowledge and an interest in people."},{"t":"p","x":"The programme is about adding range:"},{"t":"p","x":"clarity + confidence + structure + listening + assertiveness + emotional expression + storytelling + curiosity."},{"t":"p","x":"The ultimate goal is simple:"},{"t":"p","x":"People understand you.\nPeople enjoy talking to you.\nPeople remember something about you."},{"t":"p","x":"And people leave the conversation knowing that there is more to you than just your job."}]},{"id":"g-intro","title":"Goodman companion plan","group":"ref","blocks":[{"t":"p","x":"Chapters:"},{"t":"ol","n":1,"x":"Begin with a Crystal Clear Mind"},{"t":"ol","n":2,"x":"The Art of Preparing Crystal Clear Messages"},{"t":"ol","n":3,"x":"Secrets of Appealing to Any Listener or Reader"},{"t":"ol","n":4,"x":"Special Communication Challenges and Circumstances"},{"t":"ol","n":5,"x":"Staying Positive"},{"t":"ol","n":6,"x":"Script Your Success"},{"t":"p","x":"How to use Crystal Clear Communication alongside the six-month speaking programme Main rule:\nThe six-month programme is your training course.\nGoodman's audiobook is your supporting teacher."},{"t":"p","x":"Don't try to memorise the book. Listen, notice one useful idea, and then put that idea into practice in the day's exercise."}]},{"id":"g-map","title":"The overall map: weeks and Goodman chapters","group":"ref","blocks":[{"t":"tbl","rows":[["Course weeks","Your main skill","Goodman"],["Preparation","Clear your mind","Ch. 1"],["Weeks 1–4","Clear speech / being heard","Ch. 1–2"],["Weeks 5–8","Organise thoughts","Ch. 2–3"],["Weeks 9–12","Meetings / presentations","Ch. 3–4"],["Week 13","Confidence / reset","Ch. 5"],["Weeks 14–17","Listening / conversation","Ch. 3–4"],["Weeks 18–24","Assertiveness / influence / adaptation","Ch. 3–5"],["Weeks 25–26","Stories / personality / integration","Ch. 5–6"]]}]},{"id":"g-listen","title":"How to listen","group":"ref","blocks":[{"t":"p","x":"Don't make the audiobook another course you have to \"complete.\""},{"t":"p","x":"Use this rhythm:"},{"t":"p","x":"2–3 times per week"},{"t":"p","x":"Listen for 15–25 minutes while walking, driving or doing something routine."},{"t":"p","x":"During your daily 15–20-minute workout"},{"t":"p","x":"Do not listen."},{"t":"p","x":"Do the actual speaking exercises."},{"t":"p","x":"When Goodman gives you a useful idea"},{"t":"p","x":"Pause and ask:"},{"t":"p","x":"\"How would I practise that in today's exercise?\""},{"t":"p","x":"Then practise it."},{"t":"h","x":"Keep only one note"},{"t":"p","x":"After each listening session, write:"},{"t":"p","x":"\"Use this:\""},{"t":"p","x":"Then one sentence."},{"t":"p","x":"For example:"},{"t":"p","x":"\"Use this: say the important thing earlier.\""},{"t":"p","x":"That's enough."}]},{"id":"g-key","title":"The most important thing","group":"ref","blocks":[{"t":"p","x":"Don't try to make your six-month programme become a Goodman course."},{"t":"p","x":"The two have different jobs."},{"t":"p","x":"Goodman teaches you:"},{"t":"p","x":"\"How do I formulate and deliver a clearer message?\""},{"t":"p","x":"Our programme teaches you:"},{"t":"p","x":"\"How do I become a clearer, more confident, better listener, more adaptable conversationalist and ultimately a more interesting person to talk to?\""},{"t":"p","x":"That distinction is important."},{"t":"p","x":"Goodman is particularly strong for your Months 1–3 and Month 5. His published material specifically covers clear thinking, message preparation, audience adaptation, stage fright and communication challenges."},{"t":"p","x":"Your programme deliberately goes further in Months 4 and 6, especially around active listening, friendship, self-revelation, emotional communication, storytelling and personality."},{"t":"p","x":"So use Goodman as a parallel audio coach, not as a replacement for the six-month programme."},{"t":"p","x":"One adjustment I'd make to the original course"},{"t":"p","x":"Having now looked at the actual Goodman contents, I'd make one small change to our six-month programme:"},{"t":"p","x":"Add \"Goodman application\" to the Friday review every week."},{"t":"p","x":"Just one question:"},{"t":"p","x":"\"What is one idea from Goodman that I actually used this week?\""},{"t":"p","x":"That will stop the audiobook becoming passive background listening. It turns the 4h18m programme into a source of ideas that continually feed your speaking drills. The audiobook itself is 4h18m, so you have plenty of material without needing to listen every day."},{"t":"p","x":"Also, Goodman's material is clearly rooted partly in business/sales communication, and some listener reviews make that criticism as well. That's actually quite useful for you because your work is a major part of the course—but we should translate his sales-oriented material into your world rather than copy it literally."}]}],"good":[[{"t":"h","x":"Goodman section"},{"t":"p","x":"Introduction + Chapter 1: Begin with a Crystal Clear Mind"},{"t":"h","x":"Why listen now"},{"t":"p","x":"This is the right starting point because Goodman begins with getting your thoughts clear before worrying about delivery."},{"t":"p","x":"That fits your own problem particularly well: sometimes you have a good idea but formulate too much of it before speaking."},{"t":"h","x":"Listen for"},{"t":"li","x":"What exactly am I trying to say?"},{"t":"li","x":"What is my main point?"},{"t":"li","x":"What is getting in the way of saying it?"},{"t":"li","x":"Am I thinking about myself too much?"},{"t":"li","x":"Am I thinking clearly before I speak?"},{"t":"h","x":"Apply it"},{"t":"p","x":"Before your baseline recording, ask:"},{"t":"p","x":"\"If the listener remembers only one thing, what do I want it to be?\""},{"t":"p","x":"That question becomes one of the foundations of the whole six-month programme."}],[{"t":"h","x":"Your training"},{"t":"li","x":"One Thought, One Sentence"},{"t":"li","x":"Finish the Sentence"},{"t":"li","x":"Pauses"},{"t":"li","x":"Point → Reason → Example"},{"t":"li","x":"Week 1 Integration"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 1 → Chapter 2"},{"t":"h","x":"Listen for"},{"t":"p","x":"Goodman's emphasis on clarifying your intention before communicating."},{"t":"p","x":"His material on getting the mind clear is particularly relevant to your tendency to have several thoughts competing inside one sentence."},{"t":"h","x":"Your translation of Goodman"},{"t":"p","x":"Goodman: Clarify what you want to communicate."},{"t":"h","x":"Your exercise:"},{"t":"p","x":"One thought. One sentence. Pause."},{"t":"p","x":"Don't try to sound impressive. Try to make the listener's job easy."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Important Words"},{"t":"li","x":"Word Stress"},{"t":"li","x":"Articulation"},{"t":"li","x":"Vocal Variety"},{"t":"li","x":"Short Story"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2: The Art of Preparing Crystal Clear Messages"},{"t":"h","x":"Listen for"},{"t":"p","x":"How Goodman thinks about preparing the message before delivery."},{"t":"p","x":"This is where you should start connecting content preparation with spoken delivery."},{"t":"h","x":"Your translation"},{"t":"p","x":"Before speaking, identify:"},{"t":"p","x":"Point → important words → delivery"},{"t":"p","x":"For you, this is particularly important because your voice sometimes drops at the end of sentences."},{"t":"p","x":"The listener needs to know:"},{"t":"p","x":"\"This is the important bit.\""}],[{"t":"h","x":"Your training"},{"t":"li","x":"Answer First"},{"t":"li","x":"Five-Second Start"},{"t":"li","x":"Finding Words"},{"t":"li","x":"Three Levels"},{"t":"li","x":"Answer Actual Question"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2: Preparing Crystal Clear Messages"},{"t":"p","x":"This is one of the strongest overlaps in the whole book/course."},{"t":"p","x":"Goodman's programme explicitly focuses on thinking through what you want to convey and getting your point across clearly."},{"t":"h","x":"Your translation"},{"t":"p","x":"Don't build the answer while the listener waits."},{"t":"p","x":"Instead:"},{"t":"p","x":"Answer → reason → example"},{"t":"p","x":"This directly attacks your tendency to take too long to formulate an answer."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Strong Openings"},{"t":"li","x":"Don't Give Away the Floor"},{"t":"li","x":"Handling Interruptions"},{"t":"li","x":"Disagreeing Clearly"},{"t":"li","x":"Month 1 Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2 + Chapter 4"},{"t":"p","x":"Goodman specifically discusses the importance of an attention-grabbing opening and avoiding \"burying the lead.\""},{"t":"h","x":"Your translation"},{"t":"p","x":"Instead of:"},{"t":"p","x":"\"Well, there are a few things to consider...\""},{"t":"p","x":"Try:"},{"t":"p","x":"\"There are two things we need to fix.\""},{"t":"p","x":"Then stop."},{"t":"p","x":"This is exactly the kind of change that should help with your experience of people talking over you."},{"t":"h","x":"Toastmasters connection"},{"t":"p","x":"When you speak at Toastmasters, notice:"},{"t":"p","x":"Did I make my point obvious in the first sentence?"}],[{"t":"h","x":"Your training"},{"t":"li","x":"Headline First"},{"t":"li","x":"30 Seconds"},{"t":"li","x":"Add the Reason"},{"t":"li","x":"Add the Example"},{"t":"li","x":"Work Answers"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2 — The Art of Preparing Crystal Clear Messages"},{"t":"h","x":"Priority Goodman idea"},{"t":"p","x":"This is probably the single most useful Goodman chapter for you."},{"t":"p","x":"Listen for techniques that help turn a collection of thoughts into a message."},{"t":"h","x":"Your rule"},{"t":"p","x":"Headline → Reason → Example"},{"t":"p","x":"This becomes your default response structure at work."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Two Points"},{"t":"li","x":"Three Points"},{"t":"li","x":"Signposting"},{"t":"li","x":"Verbal Mind Map"},{"t":"li","x":"One-Minute Explanation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2"},{"t":"p","x":"Goodman emphasises organising thoughts and notes that audiences have limited capacity for retaining multiple points. His published material specifically recommends organising thoughts quickly and keeping to a small number of points."},{"t":"h","x":"Your translation"},{"t":"p","x":"Don't give people seven things."},{"t":"p","x":"Give them:"},{"t":"p","x":"\"There are three things I'd highlight.\""},{"t":"p","x":"Then:"},{"t":"ol","n":1,"x":"First..."},{"t":"ol","n":2,"x":"Second..."},{"t":"ol","n":3,"x":"Third..."},{"t":"p","x":"This is highly relevant to your IT/project-management communication."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Lost Thread"},{"t":"li","x":"Simplify"},{"t":"li","x":"Don't Chase Every Thought"},{"t":"li","x":"Unexpected Question"},{"t":"li","x":"Recovery Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 1 + Chapter 2"},{"t":"p","x":"This is where the \"clear mind\" idea comes back."},{"t":"h","x":"Your Goodman-inspired recovery phrase"},{"t":"p","x":"If you lose your thread:"},{"t":"p","x":"\"Let me go back to the main point.\""},{"t":"p","x":"Then say the main point."},{"t":"p","x":"Do not try to reconstruct every thought you had."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Technical Explanation"},{"t":"li","x":"Senior Manager Version"},{"t":"li","x":"Nontechnical Version"},{"t":"li","x":"12-Year-Old Version"},{"t":"li","x":"Month 2 Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3: Secrets of Appealing to Any Listener or Reader"},{"t":"p","x":"This is a particularly strong match."},{"t":"p","x":"Goodman explicitly teaches sizing up the audience and adapting the message to the listener."},{"t":"h","x":"Your translation"},{"t":"p","x":"Same idea."},{"t":"p","x":"Different listener."},{"t":"p","x":"Technical colleague:\nMore detail."},{"t":"p","x":"Senior manager:\nOutcome, risk, decision."},{"t":"p","x":"Nontechnical person:\nPlain English."},{"t":"p","x":"12-year-old:\nSimple analogy."},{"t":"p","x":"This is exactly the audience-awareness muscle we want you to build."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Enter Earlier"},{"t":"li","x":"20-Second Contribution"},{"t":"li","x":"Add Value"},{"t":"li","x":"Strong First Sentence"},{"t":"li","x":"Meeting Simulation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3"},{"t":"h","x":"Listen for"},{"t":"p","x":"Audience attention."},{"t":"p","x":"Goodman repeatedly stresses getting the important material in front of the listener rather than burying it."},{"t":"h","x":"Your translation"},{"t":"p","x":"In meetings:"},{"t":"p","x":"Don't wait until you have the perfect contribution."},{"t":"p","x":"Enter with:"},{"t":"p","x":"\"The main point I'd add is...\""},{"t":"p","x":"Then make one useful point."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Pause and Continue"},{"t":"li","x":"Clear Endings"},{"t":"li","x":"Projection"},{"t":"li","x":"Pace"},{"t":"li","x":"Floor-Holding Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4: Special Communication Challenges and Circumstances"},{"t":"h","x":"Your particular focus"},{"t":"p","x":"Goodman isn't replacing your voice-training exercises here."},{"t":"p","x":"Instead, use him as reinforcement for the bigger principle:"},{"t":"p","x":"Communication isn't finished until the other person has received the message."},{"t":"p","x":"Your own specific problem is the ending."},{"t":"p","x":"You need to finish deliberately:"},{"t":"p","x":"\"...and that's the key point.\""},{"t":"p","x":"Pause."},{"t":"p","x":"Don't let your voice disappear."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Calm Interruption Response"},{"t":"li","x":"Don't Speed Up"},{"t":"li","x":"Respectful Disagreement"},{"t":"li","x":"Difficult Question"},{"t":"li","x":"Difficult Meeting"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4 + Chapter 5"},{"t":"h","x":"Listen for"},{"t":"p","x":"Handling difficult communication circumstances without allowing emotion to derail the message."},{"t":"h","x":"Your translation"},{"t":"p","x":"When interrupted:"},{"t":"p","x":"\"Let me finish this point.\""},{"t":"p","x":"Then continue."},{"t":"p","x":"When challenged:"},{"t":"p","x":"\"I see the concern. My view is...\""},{"t":"p","x":"When you don't know:"},{"t":"p","x":"\"I don't know yet. I'll check that.\""},{"t":"p","x":"The goal is calm clarity, not winning."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Three-Part Structure"},{"t":"li","x":"Opening"},{"t":"li","x":"Six-Word Notes"},{"t":"li","x":"Unexpected Question"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4 + Chapter 6"},{"t":"h","x":"Your focus"},{"t":"p","x":"Start moving from:"},{"t":"p","x":"prepared speech"},{"t":"p","x":"towards:"},{"t":"p","x":"prepared thinking."},{"t":"p","x":"Your six-word notes should give you enough structure to speak without reading."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Light Review"},{"t":"li","x":"One-Minute Story"},{"t":"li","x":"One Opinion"},{"t":"li","x":"Year in Three Points"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 5: Staying Positive"},{"t":"h","x":"Use this chapter differently"},{"t":"p","x":"Don't treat it as motivational listening."},{"t":"p","x":"Use it to examine your relationship with speaking."},{"t":"p","x":"Ask:"},{"t":"p","x":"\"Am I trying to avoid looking foolish?\""},{"t":"p","x":"\"Am I trying to sound perfect?\""},{"t":"p","x":"\"Am I allowing nerves to make me rush?\""},{"t":"p","x":"The purpose is to reduce self-monitoring and put attention back on the listener."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Facts and Point"},{"t":"li","x":"The Question"},{"t":"li","x":"The Concern"},{"t":"li","x":"The Need"},{"t":"li","x":"Reflect Back"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3"},{"t":"p","x":"This is where your programme deliberately goes beyond Goodman."},{"t":"p","x":"Goodman gives you useful audience-awareness principles."},{"t":"p","x":"Your course adds the deeper listening sequence:"},{"t":"p","x":"Facts → Point → Question → Concern → Need → Emotion"},{"t":"h","x":"Important"},{"t":"p","x":"Don't merely ask:"},{"t":"p","x":"\"What did they say?\""},{"t":"p","x":"Ask:"},{"t":"p","x":"\"What are they really trying to get from me?\""}],[{"t":"h","x":"Your training"},{"t":"li","x":"Open Questions"},{"t":"li","x":"Follow-Up"},{"t":"li","x":"Interesting Detail"},{"t":"li","x":"Don't Interview"},{"t":"li","x":"Conversation Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3"},{"t":"p","x":"Goodman talks about appealing to listeners."},{"t":"p","x":"Your programme turns that into a social skill:"},{"t":"p","x":"Make the other person interesting to you."},{"t":"p","x":"Don't use commu erson"},{"t":"li","x":"Five Versions"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 — highest priority This is probably the second strongest overlap between Goodman and your course."},{"t":"p","x":"Goodman explicitly emphasises sizing up the audience and adapting communication to the listener."},{"t":"h","x":"Your exercise"},{"t":"p","x":"Take one message:"},{"t":"p","x":"\"We need to delay the project by two weeks.\""},{"t":"p","x":"Say it five ways."},{"t":"p","x":"The facts stay the same."},{"t":"p","x":"The communication changes."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Problem"},{"t":"li","x":"Consequence"},{"t":"li","x":"Solution"},{"t":"li","x":"Benefit"},{"t":"li","x":"Two-Minute Pitch"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 4"},{"t":"h","x":"Caution"},{"t":"p","x":"This is where Goodman's sales orientation becomes particularly noticeable."},{"t":"p","x":"His programme explicitly includes techniques for selling a product, service or idea."},{"t":"p","x":"Use the underlying communication principle, not necessarily the sales language."},{"t":"h","x":"Your version:"},{"t":"p","x":"Problem → consequence → solution → benefit"},{"t":"p","x":"That is useful for persuading managers, colleagues and stakeholders."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Name the Emotion"},{"t":"li","x":"Validate"},{"t":"li","x":"Don't Solve Too Quickly"},{"t":"li","x":"Encourage"},{"t":"li","x":"Emotional Conversation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 5"},{"t":"h","x":"But make this your own"},{"t":"p","x":"Goodman is not the main teacher for emotional intelligence here."},{"t":"p","x":"Your six-month course deliberately goes further."},{"t":"p","x":"The target is:"},{"t":"p","x":"Understand first. Solve second."},{"t":"p","x":"That will be particularly important in family and friendship conversations."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Behaviour"},{"t":"li","x":"Impact"},{"t":"li","x":"Request"},{"t":"li","x":"Receiving Criticism"},{"t":"li","x":"Difficult Conversation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4 + Chapter 5 Your Goodman connection"},{"t":"p","x":"Use the \"clear message\" principle."},{"t":"p","x":"Don't bury the message inside five minutes of explanation."},{"t":"p","x":"Instead:"},{"t":"p","x":"Behaviour → Impact → Request"},{"t":"p","x":"Example:"},{"t":"p","x":"\"When the information comes late, it affects the project timeline. I need you to give me two days' notice.\""},{"t":"p","x":"Clear."},{"t":"p","x":"Specific."},{"t":"p","x":"Respectful."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Ask First"},{"t":"li","x":"Purpose"},{"t":"li","x":"Autonomy"},{"t":"li","x":"Support"},{"t":"li","x":"Motivation Conversation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 5"},{"t":"h","x":"Listen for"},{"t":"p","x":"How the listener's perspective changes the effectiveness of your message."},{"t":"h","x":"Your adaptation"},{"t":"p","x":"Instead of:"},{"t":"p","x":"\"Here's what you need to do.\""},{"t":"p","x":"Try:"},{"t":"p","x":"\"What do you think would work?\""},{"t":"p","x":"Then:"},{"t":"p","x":"\"What would help you get there?\""},{"t":"p","x":"This is where your natural Green side becomes an asset while you practise greater directness."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Green"},{"t":"li","x":"Blue"},{"t":"li","x":"Direct"},{"t":"li","x":"Persuasive"},{"t":"li","x":"Adaptive Challenge"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 4 + Chapter 6"},{"t":"p","x":"This is your synthesis week."},{"t":"p","x":"Think:"},{"t":"p","x":"Who am I talking to?"},{"t":"p","x":"What do they need?"},{"t":"p","x":"What is my point?"},{"t":"p","x":"How should I express it?"},{"t":"p","x":"What response do I want?"},{"t":"p","x":"That's essentially the Goodman principle translated into your broader communication programme."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Story Structure"},{"t":"li","x":"Concrete Detail"},
