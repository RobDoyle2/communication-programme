ng ."},{"t":"p","x":"What did they learn about me?"},{"t":"p","x":"House, kids, gorey. From cahersiveen. Like coffee. kayaking in Switzerland. I'm thinking of an electric car."},{"t":"p","x":"Interesting in that I miss listened than talked, specially on the way down to the barrow."}]},{"title":"Baseline score","mins":null,"blocks":[{"t":"p","x":"Give yourself Bad 1–5 Good for:"},{"t":"p","x":"Baseline 1-3, 4"},{"t":"li","x":"Clear main point 2, 4"},{"t":"li","x":"Sentence length 3. 3"},{"t":"li","x":"Pausing 4, 3"},{"t":"li","x":"Emphasis 2, 4"},{"t":"li","x":"Sentence endings 1,3"},{"t":"li","x":"Volume 2, 3"},{"t":"li","x":"Finding words 2, 4"},{"t":"li","x":"Staying on track 2, 3"},{"t":"li","x":"Avoiding rambling 4, 3"},{"t":"li","x":"Answering the actual question 2, 4"},{"t":"li","x":"Listening na, 4"},{"t":"li","x":"Conversation na, 4"},{"t":"li","x":"Confidence 1, 4"},{"t":"li","x":"Interesting/engaging 1, 4"},{"t":"p","x":"Don't worry about the scores."},{"t":"p","x":"They're simply your starting line."}]}]},{"id":"g-prep","title":"Goodman: Intro + Chapter 1","group":"prep","blocks":[{"t":"h","x":"Goodman section"},{"t":"p","x":"Introduction + Chapter 1: Begin with a Crystal Clear Mind"},{"t":"h","x":"Why listen now"},{"t":"p","x":"This is the right starting point because Goodman begins with getting your thoughts clear before worrying about delivery."},{"t":"p","x":"That fits your own problem particularly well: sometimes you have a good idea but formulate too much of it before speaking."},{"t":"h","x":"Listen for"},{"t":"li","x":"What exactly am I trying to say?"},{"t":"li","x":"What is my main point?"},{"t":"li","x":"What is getting in the way of saying it?"},{"t":"li","x":"Am I thinking about myself too much?"},{"t":"li","x":"Am I thinking clearly before I speak?"},{"t":"h","x":"Apply it"},{"t":"p","x":"Before your baseline recording, ask:"},{"t":"p","x":"\"If the listener remembers only one thing, what do I want it to be?\""},{"t":"p","x":"That question becomes one of the foundations of the whole six-month programme."}]},{"id":"journey","title":"Your six-month journey","group":"ref","blocks":[{"t":"tbl","rows":[["Stage","Main Question"],["Month 1","Can people understand me easily?"],["Month 2","Can I organise my thoughts while speaking?"],["Month 3","Can I enter a conversation and hold the floor?"],["Month 4","Can I properly understand the person I'm talking to?"],["Month 5","Can I adapt my communication to the person and situation?"],["Month 6","Do people get to know the interesting person behind the information?"]]}]},{"id":"rules","title":"The five rules to carry forward","group":"ref","blocks":[{"t":"ol","n":1,"x":"SAY THE POINT EARLY. Don't make people wait for it."},{"t":"ol","n":2,"x":"ONE THOUGHT. ONE SENTENCE. PAUSE. Shorter is usually easier to understand."},{"t":"ol","n":3,"x":"FINISH. Don't let your voice disappear at the end."},{"t":"ol","n":4,"x":"LISTEN BEFORE SOLVING. Work out what the person actually wants."},{"t":"ol","n":5,"x":"BE INTERESTED, NOT IMPRESSIVE. Ask good questions."},{"t":"p","x":"Listen to the answers."},{"t":"p","x":"Reveal something about yourself."},{"t":"p","x":"Tell the occasional story."},{"t":"p","x":"Have opinions."},{"t":"p","x":"Show emotion."},{"t":"p","x":"That's where the interesting person emerges."}]},{"id":"realworld","title":"The real-world rule","group":"ref","blocks":[{"t":"p","x":"The daily 15–20 minutes is your training."},{"t":"p","x":"Real conversations are your practice ground."},{"t":"p","x":"Use the skill:"},{"t":"li","x":"at work;"},{"t":"li","x":"with your family;"},{"t":"li","x":"at your club;"},{"t":"li","x":"at Toastmasters;"},{"t":"li","x":"with friends;"},{"t":"li","x":"with people you have just met."},{"t":"p","x":"Don't judge every conversation as a performance."},{"t":"p","x":"Instead ask:"},{"t":"p","x":"“Did I deliberately practise the skill?”"},{"t":"p","x":"If yes, the day counts."}]},{"id":"toast","title":"Toastmasters through the programme","group":"ref","blocks":[{"t":"p","x":"You don't need to turn every Toastmasters meeting into another assignment."},{"t":"p","x":"Use it as a laboratory."},{"t":"p","x":"Early months"},{"t":"p","x":"Ask for feedback on:"},{"t":"li","x":"clarity;"},{"t":"li","x":"sentence length;"},{"t":"li","x":"pace;"},{"t":"li","x":"endings;"},{"t":"li","x":"main point."},{"t":"p","x":"Middle months"},{"t":"p","x":"Ask about:"},{"t":"li","x":"structure;"},{"t":"li","x":"confidence;"},{"t":"li","x":"holding attention;"},{"t":"li","x":"handling questions;"},{"t":"li","x":"naturalness."},{"t":"p","x":"Later months"},{"t":"p","x":"Ask about:"},{"t":"li","x":"personality;"},{"t":"li","x":"storytelling;"},{"t":"li","x":"emotional range;"},{"t":"li","x":"humour;"},{"t":"li","x":"genuine interest;"},{"t":"li","x":"memorability."},{"t":"p","x":"A particularly useful question is:"},{"t":"p","x":"“What was the one moment that was most engaging?”"},{"t":"p","x":"And another:"},{"t":"p","x":"“Where did I lose you?”"},{"t":"p","x":"Those answers will tell you much more than simply hearing:"},{"t":"p","x":"“Good speech.”"}]},{"id":"final","title":"Final reminder","group":"ref","blocks":[{"t":"p","x":"You are not trying to become somebody else."},{"t":"p","x":"You already have useful strengths:"},{"t":"p","x":"thoughtfulness, consideration, logic, knowledge and an interest in people."},{"t":"p","x":"The programme is about adding range:"},{"t":"p","x":"clarity + confidence + structure + listening + assertiveness + emotional expression + storytelling + curiosity."},{"t":"p","x":"The ultimate goal is simple:"},{"t":"p","x":"People understand you.\nPeople enjoy talking to you.\nPeople remember something about you."},{"t":"p","x":"And people leave the conversation knowing that there is more to you than just your job."}]},{"id":"g-intro","title":"Goodman companion plan","group":"ref","blocks":[{"t":"p","x":"Chapters:"},{"t":"ol","n":1,"x":"Begin with a Crystal Clear Mind"},{"t":"ol","n":2,"x":"The Art of Preparing Crystal Clear Messages"},{"t":"ol","n":3,"x":"Secrets of Appealing to Any Listener or Reader"},{"t":"ol","n":4,"x":"Special Communication Challenges and Circumstances"},{"t":"ol","n":5,"x":"Staying Positive"},{"t":"ol","n":6,"x":"Script Your Success"},{"t":"p","x":"How to use Crystal Clear Communication alongside the six-month speaking programme Main rule:\nThe six-month programme is your training course.\nGoodman's audiobook is your supporting teacher."},{"t":"p","x":"Don't try to memorise the book. Listen, notice one useful idea, and then put that idea into practice in the day's exercise."}]},{"id":"g-map","title":"The overall map: weeks and Goodman chapters","group":"ref","blocks":[{"t":"tbl","rows":[["Course weeks","Your main skill","Goodman"],["Preparation","Clear your mind","Ch. 1"],["Weeks 1–4","Clear speech / being heard","Ch. 1–2"],["Weeks 5–8","Organise thoughts","Ch. 2–3"],["Weeks 9–12","Meetings / presentations","Ch. 3–4"],["Week 13","Confidence / reset","Ch. 5"],["Weeks 14–17","Listening / conversation","Ch. 3–4"],["Weeks 18–24","Assertiveness / influence / adaptation","Ch. 3–5"],["Weeks 25–26","Stories / personality / integration","Ch. 5–6"]]}]},{"id":"g-listen","title":"How to listen","group":"ref","blocks":[{"t":"p","x":"Don't make the audiobook another course you have to \"complete.\""},{"t":"p","x":"Use this rhythm:"},{"t":"p","x":"2–3 times per week"},{"t":"p","x":"Listen for 15–25 minutes while walking, driving or doing something routine."},{"t":"p","x":"During your daily 15–20-minute workout"},{"t":"p","x":"Do not listen."},{"t":"p","x":"Do the actual speaking exercises."},{"t":"p","x":"When Goodman gives you a useful idea"},{"t":"p","x":"Pause and ask:"},{"t":"p","x":"\"How would I practise that in today's exercise?\""},{"t":"p","x":"Then practise it."},{"t":"h","x":"Keep only one note"},{"t":"p","x":"After each listening session, write:"},{"t":"p","x":"\"Use this:\""},{"t":"p","x":"Then one sentence."},{"t":"p","x":"For example:"},{"t":"p","x":"\"Use this: say the important thing earlier.\""},{"t":"p","x":"That's enough."}]},{"id":"g-key","title":"The most important thing","group":"ref","blocks":[{"t":"p","x":"Don't try to make your six-month programme become a Goodman course."},{"t":"p","x":"The two have different jobs."},{"t":"p","x":"Goodman teaches you:"},{"t":"p","x":"\"How do I formulate and deliver a clearer message?\""},{"t":"p","x":"Our programme teaches you:"},{"t":"p","x":"\"How do I become a clearer, more confident, better listener, more adaptable conversationalist and ultimately a more interesting person to talk to?\""},{"t":"p","x":"That distinction is important."},{"t":"p","x":"Goodman is particularly strong for your Months 1–3 and Month 5. His published material specifically covers clear thinking, message preparation, audience adaptation, stage fright and communication challenges."},{"t":"p","x":"Your programme deliberately goes further in Months 4 and 6, especially around active listening, friendship, self-revelation, emotional communication, storytelling and personality."},{"t":"p","x":"So use Goodman as a parallel audio coach, not as a replacement for the six-month programme."},{"t":"p","x":"One adjustment I'd make to the original course"},{"t":"p","x":"Having now looked at the actual Goodman contents, I'd make one small change to our six-month programme:"},{"t":"p","x":"Add \"Goodman application\" to the Friday review every week."},{"t":"p","x":"Just one question:"},{"t":"p","x":"\"What is one idea from Goodman that I actually used this week?\""},{"t":"p","x":"That will stop the audiobook becoming passive background listening. It turns the 4h18m programme into a source of ideas that continually feed your speaking drills. The audiobook itself is 4h18m, so you have plenty of material without needing to listen every day."},{"t":"p","x":"Also, Goodman's material is clearly rooted partly in business/sales communication, and some listener reviews make that criticism as well. That's actually quite useful for you because your work is a major part of the course—but we should translate his sales-oriented material into your world rather than copy it literally."}]}],"good":[[{"t":"h","x":"Goodman section"},{"t":"p","x":"Introduction + Chapter 1: Begin with a Crystal Clear Mind"},{"t":"h","x":"Why listen now"},{"t":"p","x":"This is the right starting point because Goodman begins with getting your thoughts clear before worrying about delivery."},{"t":"p","x":"That fits your own problem particularly well: sometimes you have a good idea but formulate too much of it before speaking."},{"t":"h","x":"Listen for"},{"t":"li","x":"What exactly am I trying to say?"},{"t":"li","x":"What is my main point?"},{"t":"li","x":"What is getting in the way of saying it?"},{"t":"li","x":"Am I thinking about myself too much?"},{"t":"li","x":"Am I thinking clearly before I speak?"},{"t":"h","x":"Apply it"},{"t":"p","x":"Before your baseline recording, ask:"},{"t":"p","x":"\"If the listener remembers only one thing, what do I want it to be?\""},{"t":"p","x":"That question becomes one of the foundations of the whole six-month programme."}],[{"t":"h","x":"Your training"},{"t":"li","x":"One Thought, One Sentence"},{"t":"li","x":"Finish the Sentence"},{"t":"li","x":"Pauses"},{"t":"li","x":"Point → Reason → Example"},{"t":"li","x":"Week 1 Integration"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 1 → Chapter 2"},{"t":"h","x":"Listen for"},{"t":"p","x":"Goodman's emphasis on clarifying your intention before communicating."},{"t":"p","x":"His material on getting the mind clear is particularly relevant to your tendency to have several thoughts competing inside one sentence."},{"t":"h","x":"Your translation of Goodman"},{"t":"p","x":"Goodman: Clarify what you want to communicate."},{"t":"h","x":"Your exercise:"},{"t":"p","x":"One thought. One sentence. Pause."},{"t":"p","x":"Don't try to sound impressive. Try to make the listener's job easy."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Important Words"},{"t":"li","x":"Word Stress"},{"t":"li","x":"Articulation"},{"t":"li","x":"Vocal Variety"},{"t":"li","x":"Short Story"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2: The Art of Preparing Crystal Clear Messages"},{"t":"h","x":"Listen for"},{"t":"p","x":"How Goodman thinks about preparing the message before delivery."},{"t":"p","x":"This is where you should start connecting content preparation with spoken delivery."},{"t":"h","x":"Your translation"},{"t":"p","x":"Before speaking, identify:"},{"t":"p","x":"Point → important words → delivery"},{"t":"p","x":"For you, this is particularly important because your voice sometimes drops at the end of sentences."},{"t":"p","x":"The listener needs to know:"},{"t":"p","x":"\"This is the important bit.\""}],[{"t":"h","x":"Your training"},{"t":"li","x":"Answer First"},{"t":"li","x":"Five-Second Start"},{"t":"li","x":"Finding Words"},{"t":"li","x":"Three Levels"},{"t":"li","x":"Answer Actual Question"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2: Preparing Crystal Clear Messages"},{"t":"p","x":"This is one of the strongest overlaps in the whole book/course."},{"t":"p","x":"Goodman's programme explicitly focuses on thinking through what you want to convey and getting your point across clearly."},{"t":"h","x":"Your translation"},{"t":"p","x":"Don't build the answer while the listener waits."},{"t":"p","x":"Instead:"},{"t":"p","x":"Answer → reason → example"},{"t":"p","x":"This directly attacks your tendency to take too long to formulate an answer."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Strong Openings"},{"t":"li","x":"Don't Give Away the Floor"},{"t":"li","x":"Handling Interruptions"},{"t":"li","x":"Disagreeing Clearly"},{"t":"li","x":"Month 1 Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 2 + Chapter 4"},{"t":"p","x":"Goodman specifically discusses the importance of an attention-grabbing opening and avoiding \"burying the lead.\""},{"t":"h","x":"Your translation"},{"t":"p","x":"Ins nication techniques merely to make yourself sound good."},{"t":"p","x":"Use them to become genuinely curious."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Small Personal Detail"},{"t":"li","x":"Story Fragment"},{"t":"li","x":"Shared Connection"},{"t":"li","x":"Joining a Group"},{"t":"li","x":"Ask → Reveal → Follow"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 5 This is another point where your programme deliberately goes beyond the book."},{"t":"p","x":"Goodman can help with listener awareness."},{"t":"p","x":"But friendship-building requires you to reveal something about yourself."},{"t":"h","x":"Your target:"},{"t":"p","x":"Ask → reveal → follow."},{"t":"p","x":"Not:"},{"t":"p","x":"Ask → ask → ask → ask."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Information"},{"t":"li","x":"Reassurance"},{"t":"li","x":"Empathy"},{"t":"li","x":"Problem-Solving"},{"t":"li","x":"Adaptive Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 4"},{"t":"p","x":"This is one of the most useful combinations."},{"t":"p","x":"Before responding, identify what the person needs."},{"t":"p","x":"Do they need:"},{"t":"li","x":"information?"},{"t":"li","x":"reassurance?"},{"t":"li","x":"empathy?"},{"t":"li","x":"a solution?"},{"t":"li","x":"motivation?"},{"t":"h","x":"Your key question"},{"t":"p","x":"\"What kind of response does this person need from me?\""}],[{"t":"h","x":"Your training"},{"t":"li","x":"State a Preference"},{"t":"li","x":"Say No"},{"t":"li","x":"State Your View"},{"t":"li","x":"Disagree"},{"t":"li","x":"Assertiveness Test"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 4 + Chapter 5"},{"t":"h","x":"Your focus"},{"t":"p","x":"Goodman's confidence material is useful here, but don't confuse confidence with forcefulness."},{"t":"p","x":"Your target is:"},{"t":"p","x":"Clear + calm + respectful."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Technical Person"},{"t":"li","x":"Senior Person"},{"t":"li","x":"Concerned Person"},{"t":"li","x":"Busy Person"},{"t":"li","x":"Five Versions"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 — highest priority This is probably the second strongest overlap between Goodman and your course."},{"t":"p","x":"Goodman explicitly emphasises sizing up the audience and adapting communication to the listener."},{"t":"h","x":"Your exercise"},{"t":"p","x":"Take one message:"},{"t":"p","x":"\"We need to delay the project by two weeks.\""},{"t":"p","x":"Say it five ways."},{"t":"p","x":"The facts stay the same."},{"t":"p","x":"The communication changes."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Problem"},{"t":"li","x":"Consequence"},{"t":"li","x":"Solution"},{"t":"li","x":"Benefit"},{"t":"li","x":"Two-Minute Pitch"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 4"},{"t":"h","x":"Caution"},{"t":"p","x":"This is where Goodman's sales orientation becomes particularly noticeable."},{"t":"p","x":"His programme explicitly includes techniques for selling a product, service or idea."},{"t":"p","x":"Use the underlying communication principle, not necessarily the sales language."},{"t":"h","x":"Your version:"},{"t":"p","x":"Problem → consequence → solution → benefit"},{"t":"p","x":"That is useful for persuading managers, colleagues and stakeholders."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Name the Emotion"},{"t":"li","x":"Validate"},{"t":"li","x":"Don't Solve Too Quickly"},{"t":"li","x":"Encourage"},{"t":"li","x":"Emotional Conversation"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 3 + Chapter 5"},{"t":"h","x":"But make this your own"},{"t":"p","x":"Goodman is not the main teacher for emotional intelligence here."},{"t":"p","x":"Your six-month course deliberately goes further."},{"t":"p","x":"The target is:"},{"t":"p","x":"Understand first. Solve second."},{"t":"p","x":"That will be particularly important in family and friendship conversations."}],[{"t":"h","x":"Your training"},{"t":"li","x":"Behaviour"},{"t":"li","x":"Impact"},{"t":"li","x":"Request"},{"t":"li", {"t":"li","x":"Emotion"},{"t":"li","x":"Opinions"},{"t":"li","x":"Personality"},{"t":"h","x":"Goodman"},{"t":"p","x":"Chapter 6: Script Your Success"},{"t":"h","x":"Important distinction"},{"t":"p","x":"This is where Goodman becomes a supporting resource rather than the main teacher."},{"t":"p","x":"Your goal now isn't simply:"},{"t":"p","x":"\"Can I communicate clearly?\""},{"t":"p","x":"It's:"},{"t":"p","x":"\"Do people enjoy listening to me?\""},{"t":"p","x":"That's a bigger question."},{"t":"p","x":"Goodman helps with preparation and deliberate practice."},{"t":"p","x":"Your course now adds:"},{"t":"li","x":"stories"},{"t":"li","x":"opinions"},{"t":"li","x":"concrete details"},{"t":"li","x":"emotion"},{"t":"li","x":"personality"},{"t":"li","x":"self-revelation"},{"t":"p","x":"These are what help you move towards your ambition:"},{"t":"p","x":"\"That man is interesting.\""}],[{"t":"p","x":"Goodman: Chapter 3"},{"t":"p","x":"Your focus:\nListen more than you speak."},{"t":"p","x":"Find something genuinely interesting about another person."}],[{"t":"p","x":"Goodman: Chapter 5 + Chapter 6"},{"t":"p","x":"Don't try to be perfect."},{"t":"p","x":"Use what you've practised:"},{"t":"p","x":"Point → Reason → Example → Story → Opinion"},{"t":"p","x":"Stay relaxed."},{"t":"p","x":"Recover if you lose your thread."},{"t":"p","x":"Finish clearly."}],[{"t":"p","x":"Goodman: Revisit the ideas that proved most useful."},{"t":"p","x":"Don't try to listen to the whole book again."},{"t":"p","x":"Instead, ask:"},{"t":"p","x":"What did Goodman give me?"},{"t":"ol","n":1,"x":"Clear mind"},{"t":"p","x":"Before speaking, know what you want to say."},{"t":"ol","n":2,"x":"Clear message"},{"t":"p","x":"Don't bury the point."},{"t":"ol","n":3,"x":"Listener awareness"},{"t":"p","x":"Shape the message for the person hearing it."},{"t":"ol","n":4,"x":"Practice"},{"t":"p","x":"Don't wait until you're confident before communicating."},{"t":"ol","n":5,"x":"Audience attention"},{"t":"p","x":"Give people a reason to listen."},{"t":"ol","n":6,"x":"Deliberate preparation"},{"t":"p","x":"Prepare the thinking, not just the words."}]]}</script>

const W={};D.days.forEach(d=>{const m=mon(d.date);(W[m]=W[m]||[]).push(d)});
const goal=d=>{const p=d.intro.find(b=>b.t==='p'&&/^Today.s goal/i.test(b.x));return p?p.x.replace(/^Today.s goal:?\s*/i,''):''};
const cnt=d=>{const n=d.tasks.length;let c=0;for(let i=0;i<n;i++)if(S.done[d.date+':'+i])c++;return[c,n]};
let vy,vm;
{const t=new Date(),s=t<START?START:t>END?END:t;vy=s.getFullYear();vm=s.getMonth()}
function grid(){
 const first=new Date(vy,vm,1),off=(first.getDay()+6)%7,n=new Date(vy,vm+1,0).getDate(),rows=Math.ceil((off+n)/7);
 $('grid').style.gridTemplateRows=`repeat(${rows},minmax(${innerWidth<640?74:84}px,1fr))`;let h='';
 for(let i=0;i<rows*7;i++){const dn=i-off+1;
  if(dn<1||dn>n){h+='<div class="c x"></div>';continue}
  const dt=new Date(vy,vm,dn),k=key(dt),d=days[k],inr=dt>=START&&dt<=END,wk=dt.getDay()%6===0;
  if(!inr){h+=`<div class="c o"><span class="n">${dn}</span></div>`;continue}
  let cl='c'+(k===TODAY?' today':'')+(wk?' wk':'')+(S.notes[k]?' note':''),inner=`<span class="n">${dn}</span>`,bar='';
  if(d){const[c,t]=cnt(d);
   if(t&&c===t)cl+=' done';else if(t&&c)bar=`<i class="bar" style="--p:${c/t*100}%"></i>`;
   inner+=`<span class="l">${d.kind==='day'?'Day '+d.n:d.kind==='prep'?'Prep '+d.n:'Rest'}</span><span class="t">${esc(d.title)}</span>`}
  else inner+='<span class="r">Rest / optional practice</span>';
  h+=`<button class="${cl}" data-k="${k}" aria-label="${dt.toDateString()}${d?': '+d.title:''}">${inner}${bar}</button>`}
 $('grid').innerHTML=h;
 $('mt').textContent=first.toLocaleDateString('en-IE',{month:'long',year:'numeric'});
 $('pv').disabled=vy===2026&&vm===9;$('nx').disabled=vy===2027&&vm===2;
 const dd=D.days.filter(d=>d.kind==='day'&&cnt(d)[0]===d.tasks.length&&d.tasks.length).length;
 $('prog').textContent=`${dd} of 126 days complete`}
let cur=null,tmr;
function show(html,ctx){$('panel').innerHTML=html;$('panel').hidden=$('bk').hidden=false;cur=ctx;$('panel').querySelector('.pb').scrollTop=0;$('panel').querySelector('.ph button').focus()}
function close(){$('panel').hidden=$('bk').hidden=true;cur=null;grid()}
const tabs=w=>`<nav class="tabs"><button data-close>⌂ Home</button>${w?`<button data-wk="${w}">Week</button>`:''}</nav>`;
const head=(s,t,m,w)=>tabs(w)+`<div class="ph"><div><div class="s">${esc(s)}</div><h2>${esc(t)}</h2>${m?`<div class="m">${esc(m)}</div>`:''}</div><button aria-label="Close" data-close>✕</button></div>`;
const task=(t,i,id,done)=>`<section class="tk${done?' done':' open'}" data-id="${id}"><header><span class="tt">${esc(t.title)}</span>${t.mins?`<span class="tm">${t.mins}</span>`:''}<button class="ck" data-ck>${done?'Done ✓':'Mark done'}</button><span class="cv">▾</span></header><div class="tb">${B(t.blocks)}</div></section>`;
const note=(k,label)=>`<div class="nt"><label for="nt">${label}</label><textarea id="nt" placeholder="How did it go? What did you notice? What will you do differently?">${esc(S.notes[k]||'')}</textarea><small id="sv"></small></div>`;
function openDay(k){
 const dt=parse(k),d=days[k],long=dt.toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const wk=W[mon(k)]?mon(k):null;
 if(!d){show(head(long,'Rest / optional real-world practice',null,wk)+`<div class="pb"><p>Weekends: Rest / optional real-world practice.</p>${note(k,'Note (optional)')}</div>`,{k,note:k});return}
 const m=d.kind==='prep'?'Preparation':`Month ${d.month} · ${d.monthName}${d.week?` · Week ${d.week} — ${d.weekName}`:` · ${d.weekName}`}`;
 const[c,n]=cnt(d);
 let h=head(long,d.kind==='rest'?'Rest day — '+d.title:`${d.label} — ${d.title}`,m,wk)+'<div class="pb">';
 if(n)h+=`<div class="prg" id="prg">${c} of ${n} tasks done</div>`;
 if(d.weekIntro&&d.weekIntro.length)h+=`<details class="gd"><summary>This week's focus</summary>${B(d.weekIntro)}</details>`;
 if(d.intro.length)h+=`<div class="intro">${B(d.intro)}</div>`;
 d.tasks.forEach((t,i)=>h+=task(t,i,k+':'+i,S.done[k+':'+i]));
 if(d.g!=null)h+=`<details class="gd"><summary>Goodman audiobook — this week</summary>${B(D.good[d.g])}</details>`;
 h+=note(k,'End-of-day note')+'</div>';show(h,{k,note:k,day:d})}
function openWeek(m){
 const ds=W[m];if(!ds)return;const f=ds[0],a=parse(m),e=new Date(a);e.setDate(a.getDate()+6);
 const fm=d=>d.toLocaleDateString('en-IE',{day:'numeric',month:'short'});
 let h=head(`${fm(a)} – ${fm(e)}`,f.week===0?'Preparation week':f.week?`Week ${f.week} — ${f.weekName}`:f.weekName,f.week===0?'':`Month ${f.month} · ${f.monthName}`)+'<div class="pb"><h4>Week goals</h4>';
 h+=f.weekIntro&&f.weekIntro.length?`<div class="intro">${B(f.weekIntro)}</div>`:`<p>This week's focus: <b>${esc(f.weekName)}</b></p>`;
 h+='<h4>Day by day</h4>';
 ds.forEach(d=>{const[c,n]=cnt(d),g=goal(d),wd=parse(d.date).toLocaleDateString('en-IE',{weekday:'long'});
  h+=`<button class="wd${n&&c===n?' dn':''}" data-day="${d.date}"><span class="wl">${wd} · ${d.label}</span><b>${esc(d.title)}</b>${g?`<span class="wg">${esc(g)}</span>`:''}</button>`});
 const gd=ds.find(d=>d.g!=null);
 if(gd)h+=`<details class="gd"><summary>Goodman audiobook — this week</summary>${B(D.good[gd.g])}</details>`;
 show(h+'</div>',{})}
function openPage(id){
 const p=pages[id];let h=head(p.group==='ref'?'Reference':'Preparation & Baseline',p.title)+'<div class="pb">'+B(p.blocks);
 (p.tasks||[]).forEach((t,i)=>h+=task(t,i,'page:'+id+':'+i,S.done['page:'+id+':'+i]));
 if(p.tasks)h+=note('page:'+id,'Notes');show(h+'</div>',{note:p.tasks?'page:'+id:null})}
$('panel').addEventListener('click',e=>{
 if(e.target.closest('[data-close]'))return close();
 const w=e.target.closest('[data-wk]');if(w)return openWeek(w.dataset.wk);
 const dy=e.target.closest('[data-day]');if(dy)return openDay(dy.dataset.day);
 const tk=e.target.closest('.tk');if(!tk)return;
 if(e.target.closest('[data-ck]')){const id=tk.dataset.id,on=!S.done[id];on?S.done[id]=1:delete S.done[id];save();
  tk.classList.toggle('done',on);tk.classList.toggle('open',!on);e.target.textContent=on?'Done ✓':'Mark done';
  if(cur&&cur.day){const[c,n]=cnt(cur.day);$('prg').textContent=c===n?`All ${n} tasks done — add a note below.`:`${c} of ${n} tasks done`}
  grid();return}
 if(e.target.closest('header'))tk.classList.toggle('open')});
$('panel').addEventListener('input',e=>{if(e.target.id!=='nt'||!cur||!cur.note)return;
 const v=e.target.value,k=cur.note;v.trim()?S.notes[k]=v:delete S.notes[k];$('sv').textContent='Saving…';
 clearTimeout(tmr);tmr=setTimeout(()=>{save();$('sv').textContent='Saved';grid()},400)});
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)openDay(b.dataset.k)});
$('bk').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('panel').hidden)close()});
$('pv').onclick=()=>{vm--;if(vm<0){vm=11;vy--}grid()};$('nx').onclick=()=>{vm++;if(vm>11){vm=0;vy++}grid()};
$('wkb').onclick=()=>{const p=`${vy}-${pad(vm+1)}`,f=D.days.find(d=>d.date.startsWith(p));
 openWeek(TODAY.startsWith(p)&&W[mon(TODAY)]?mon(TODAY):f?mon(f.date):Object.keys(W)[0])};
$('td').onclick=()=>{const t=new Date();if(t<START||t>END){vy=2026;vm=9}else{vy=t.getFullYear();vm=t.getMonth()}grid();if(t>=START&&t<=END)openDay(TODAY)};
const pl=(label,attr)=>`<button class="pill" ${attr}>${label}</button>`;
$('prepl').innerHTML=pl('Start here','data-p="start"')+pl('Preparation Day 1','data-d="2026-10-01"')+pl('Preparation Day 2','data-d="2026-10-02"')+pl('Baseline','data-p="baseline"')+pl('Goodman: Intro + Ch. 1','data-p="g-prep"');
$('refm').innerHTML=D.pages.filter(p=>p.group==='ref').map(p=>`<button data-p="${p.id}">${esc(p.title)}</button>`).join('');
document.querySelector('footer').addEventListener('click',e=>{const b=e.target.closest('[data-p],[data-d]');if(!b)return;$('ref').open=false;b.dataset.p?openPage(b.dataset.p):openDay(b.dataset.d)});
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='communication-programme-backup.json';a.click()};
$('im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S={done:o.done||{},notes:o.notes||{}};save();grid();alert('Backup restored.')}catch(x){alert('That file could not be read.')}};if(e.target.files[0])r.readAsText(e.target.files[0])};
grid();
</script>
</body>
</html>
