<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Communication Programme</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--sf:#fff;--tx:#1d2420;--mu:#6a746d;--ln:#dcdad2;--ac:#0f766e;--ac2:#ccefe9;--ok:#dff3e4;--okt:#1e7a3c;--wk:#efede7;--sh:0 10px 40px rgba(0,0,0,.2)}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--sf:#1d2220;--tx:#e8ece9;--mu:#9aa59d;--ln:#333a36;--ac:#4fd1c0;--ac2:#18403b;--ok:#1b3324;--okt:#6fd48f;--wk:#191d1b;--sh:0 10px 40px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:1.25rem;margin:0;min-width:11ch}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button,.pill{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:5px 12px}
.nav button:disabled{opacity:.35;cursor:default}
#mt{min-width:9.5ch;text-align:center;font-weight:600}
#prog{color:var(--mu);font-size:.85rem}
main{flex:1 0 auto;display:flex;flex-direction:column;padding:0 12px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 0 4px;color:var(--mu);font-size:.8rem;text-align:center}
#grid{flex:1 0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.c{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0;overflow:hidden}
.c.x{visibility:hidden}.c.o{opacity:.4}
button.c:hover{border-color:var(--ac)}
.c.wk{background:var(--wk)}
.c .n{font-weight:600;font-size:.95rem;width:1.7em;height:1.7em;line-height:1.7em;text-align:center;border-radius:50%}
.c .l{white-space:nowrap;overflow:hidden;font-size:.72rem;color:var(--ac);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.c .t{font-size:.82rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c .r{font-size:.72rem;color:var(--mu);font-style:italic}
.c.today{border:2px solid var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.c.today .n{background:var(--ac);color:var(--bg)}
.c.done{background:var(--ok)}.c.done .l{color:var(--okt)}
.c.done::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--okt);font-weight:700}
.c.note::before{content:"";position:absolute;bottom:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--ac);width:var(--p,0)}
footer{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;font-size:.88rem;border-top:1px solid var(--ln);margin-top:8px;position:relative}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-weight:600;margin-right:2px}
footer .pill{font-size:.85rem;padding:3px 10px}
a.pill{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:4px}.pill:hover{border-color:var(--ac)}
.right{margin-left:auto}
details.more>summary{list-style:none;cursor:pointer}details.more>summary::-webkit-details-marker{display:none}
.menu{position:absolute;bottom:100%;right:12px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;box-shadow:var(--sh);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:250px;z-index:5}
.menu button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:6px}.menu button:hover{background:var(--ac2)}
#bk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);box-shadow:var(--sh);z-index:11;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:in .18s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;padding:12px 18px 0}.tabs button{background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:4px 14px;font-size:.9rem}.tabs button:first-child{border-color:var(--ac);color:var(--ac);font-weight:600}
.wd{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin-bottom:8px;position:relative}.wd:hover{border-color:var(--ac)}.wd .wl{color:var(--ac);font-size:.78rem;font-weight:600}.wd .wg{color:var(--mu);font-size:.88rem}.wd.dn{background:var(--ok)}.wd.dn::after{content:"✓";position:absolute;right:12px;top:8px;color:var(--okt);font-weight:700}
.ph{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--ln)}
.ph .s{color:var(--ac);font-weight:600;font-size:.85rem}.ph h2{margin:2px 0;font-size:1.3rem;line-height:1.25}.ph .m{color:var(--mu);font-size:.82rem}
.ph>button{margin-left:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px;width:36px;height:36px;flex:none}
.pb{flex:1;overflow:auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
.prg{color:var(--mu);font-size:.9rem;margin-bottom:10px}
.intro{background:var(--ac2);border-radius:10px;padding:2px 14px;margin-bottom:12px}
.tk{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;overflow:hidden}
.tk>header{padding:10px 12px;gap:8px;flex-wrap:nowrap;cursor:pointer}
.tk .tt{font-weight:600;flex:1}.tk .tm{color:var(--mu);font-size:.8rem}
.tk .ck{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:999px;padding:3px 12px;font-size:.85rem;white-space:nowrap}
.tk.done .ck{background:var(--ac);color:var(--bg)}
.tk .tb{padding:0 14px 6px;display:none}.tk.open .tb{display:block}
.tk.done{opacity:.75}
.tk .cv{transition:transform .15s;color:var(--mu)}.tk.open .cv{transform:rotate(180deg)}
.pb p{margin:.5em 0}.pb ul,.pb ol{margin:.4em 0;padding-left:1.4em}.pb li{margin:.15em 0}
.pb h4{margin:1em 0 .2em;color:var(--ac);font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
.pb blockquote{margin:.6em 0;padding:.2em 12px;border-left:3px solid var(--ac);color:var(--mu);font-style:italic}
p.ind{margin-left:1em;padding-left:10px;border-left:2px solid var(--ln)}
.tw{overflow-x:auto}table{border-collapse:collapse;margin:.6em 0;font-size:.9rem}td,th{border:1px solid var(--ln);padding:4px 10px;text-align:left}th{background:var(--ac2)}
details.gd{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 14px;margin:12px 0}details.gd summary{cursor:pointer;font-weight:600}
.nt{margin-top:16px}.nt label{font-weight:600;display:block;margin-bottom:4px}
.nt textarea{width:100%;min-height:130px;resize:vertical;font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.nt small{color:var(--mu)}
@media(max-width:640px){#grid,.dow{gap:3px}.c{padding:3px 4px;border-radius:7px}.c .t,.c .r{display:none}.c .l{font-size:.6rem;letter-spacing:0}.c .n{font-size:.8rem}header h1{font-size:1.05rem}.c.done::after{top:3px;right:4px;font-size:.8rem}}
</style>
</head>

</footer>

ach phrase, complete the sentence with a simple idea."},{"t":"p","x":"For example: “The biggest issue is that we don't have enough time.”"}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"When someone asks you a question, you may start explaining the background while you work out your answer. The listener then has to wait for the point."},{"t":"p","x":"Instead, give the answer first. Add the explanation afterwards."},{"t":"p","x":"Use this structure:"},{"t":"p","x":"Answer → Reason → Example"},{"t":"p","x":"For example:"},{"t":"p","x":"Question: “Do you think we should change the project plan?”"},{"t":"p","x":"Answer: “Yes, I think we should.”"},{"t":"p","x":"Reason: “The current plan leaves too little time for testing.”"},{"t":"p","x":"Example: “Last time, we found several problems during the final week.”"},{"t":"p","x":"You don't need all three parts every time. Use only what helps the listener."}]},{"title":"Speaking drill","mins":"5 min","blocks":[{"t":"p","x":"Answer these five questions. Allow about 30–40 seconds for each."},{"t":"ol","n":1,"x":"What makes a good manager?"},{"t":"ol","n":2,"x":"What is the most important part of your job?"},{"t":"ol","n":3,"x":"What makes a conversation enjoyable?"},{"t":"ol","n":4,"x":"What is something you would like to learn?"},{"t":"ol","n":5,"x":"What makes someone a good friend?"},{"t":"p","x":"For every answer:"},{"t":"ol","n":1,"x":"Start with “The short answer is…” or “I think…”"},{"t":"ol","n":2,"x":"State your answer in the first sentence."},{"t":"ol","n":3,"x":"Give one reason."},{"t":"ol","n":4,"x":"Stop when you've made your point."},{"t":"p","x":"Don't restart an answer because the wording wasn't perfect."}]},{"title":"Real-life application","mins":"5 min","blocks":[{"t":"p","x":"Think of a question you might realistically be asked at work this week."},{"t":"p","x":"For example:"},{"t":"li","x":"“What's the current status?”"},{"t":"li","x":"“What's the problem?”"},{"t":"li","x":"“What do you recommend?”"},{"t":"li","x":"“Do we need to change the plan?”"},{"t":"p","x":"Answer it aloud twice."},{"t":"p","x":"First attempt: Answer naturally."},{"t":"p","x":"Second attempt: Give the answer in your first sentence, then explain."},{"t":"p","x":"If you have time, record the second attempt and listen back. Could someone understand your position within the first five seconds?"}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I answer before explaining?"},{"t":"li","x":"Did I add unnecessary background?"},{"t":"li","x":"Did the answer sound more confident when I led with the point?"},{"t":"p","x":"Today's takeaway: Write one sentence describing what you want to remember."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In one conversation today, give your answer before explaining your reasoning."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-20","kind":"day","n":12,"label":"Day 12","title":"Five-Second Start","intro":[{"t":"p","x":"Today's goal: Begin speaking without waiting for the perfect opening."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a familiar subject, such as your weekend, your work or a hobby."},{"t":"p","x":"Speak about it for 30 seconds."},{"t":"p","x":"Don't prepare notes. Just start."},{"t":"p","x":"Now choose another subject and begin within five seconds."},{"t":"p","x":"Notice the difference between preparing endlessly and simply getting started."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Sometimes the difficulty isn't knowing what to say. It's finding the first sentence."},{"t":"p","x":"You may try to construct the entire answer in your head before opening your mouth. That creates pressure and can make spontaneous speaking harder."},{"t":"p","x":"Today, practise starting with a simple, useful sentence. You can develop the thought after you begin."},{"t":"p","x":"Use one of these openings:"},{"t":"li","x":"“My first thought is…”"},{"t":"li","x":"“I think the main issue is…”"},{"t":"li","x":"“One example that comes to mind is…”"},{"t":"li","x":"“The way I see it…”"},{"t":"li","x":"“Something I've noticed is…”"},{"t":"p","x":"These are starting points, not phrases you must use every time."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Complete five rounds."},{"t":"p","x":"For each round:"},{"t":"ol","n":1,"x":"Read the question."},{"t":"ol","n":2,"x":"Give yourself no more than five seconds."},{"t":"ol","n":3,"x":"Start speaking."},{"t":"ol","n":4,"x":"Continue for approximately 40–45 seconds."},{"t":"ol","n":5,"x":"Pause briefly before the next round."},{"t":"p","x":"Questions:"},{"t":"ol","n":1,"x":"What makes a workplace enjoyable?"},{"t":"ol","n":2,"x":"What is something you have learned from experience?"},{"t":"ol","n":3,"x":"What makes a person interesting?"},{"t":"ol","n":4,"x":"What would you change about how meetings are run?"},{"t":"ol","n":5,"x":"What is something you enjoy doing outdoors?"},{"t":"p","x":"After the five rounds, choose one question and answer it again for 60 seconds."},{"t":"p","x":"Don't aim for a brilliant answer. Aim for a clear beginning and a complete thought."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Imagine that a colleague asks you unexpectedly:"},{"t":"q","x":"“What do you think we should do about this?”"},{"t":"p","x":"Choose a real or imaginary work issue."},{"t":"p","x":"Give yourself five seconds, then respond for one minute."},{"t":"p","x":"Repeat the exercise with a social question:"},{"t":"q","x":"“What have you been up to lately?”"},{"t":"p","x":"Practise giving a straightforward answer that includes one interesting detail."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I wait for a perfect opening?"},{"t":"li","x":"Did the first sentence become easier after a few rounds?"},{"t":"li","x":"Did I discover that I could develop the thought once I started?"},{"t":"p","x":"Today's takeaway: “I can start simply and develop the answer as I speak.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"When someone asks for your opinion today, try to begin within five seconds rather than mentally rehearsing a complete response."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-21","kind":"day","n":13,"label":"Day 13","title":"Finding Words and Recovering Smoothly","intro":[{"t":"p","x":"Today's goal: Keep communicating when the words don't come easily."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose an everyday object near you."},{"t":"p","x":"Describe it without naming it."},{"t":"p","x":"For example, if the object is a mug:"},{"t":"q","x":"“It's something you drink from. It usually has a handle. You might use it for coffee or tea.”"},{"t":"p","x":"Repeat with two other objects."},{"t":"p","x":"This trains you to explain an idea even when the exact word isn't immediately available."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Good communicators don't always find the perfect word immediately. They know how to recover and continue."},{"t":"p","x":"If you get stuck, don't panic or abandon the sentence. Try one of these phrases:"},{"t":"li","x":"“What I mean is…”"},{"t":"li","x":"“Let me put that more simply.”"},{"t":"li","x":"“The point I'm getting at is…”"},{"t":"li","x":"“Another way to explain it is…”"},{"t":"li","x":"“Let me start that thought again.”"},{"t":"p","x":"Use these phrases naturally. You don't need to apologise for every hesitation."},{"t":"p","x":"The objective is to recover without losing the main point."}]},{"title":"Speaking drill","mins":"5–6 min","blocks":[{"t":"p","x":"Exercise A — Explain another way"},{"t":"p","x":"Complete these five examples aloud:"},{"t":"ol","n":1,"x":"“The project is difficult because…” Explain the same problem in a simpler way."},{"t":"ol","n":2,"x":"“The main risk is…” Give a concrete example."},{"t":"ol","n":3,"x":"“What I'm trying to say is…” Finish the thought in plain English."},{"t":"ol","n":4,"x":"“Another way to look at it is…” Offer a different perspective."},{"t":"ol","n":5,"x":"“Let me put that more simply…” Explain a technical concept to a nontechnical person."},{"t":"p","x":"Allow about 45 seconds per example."},{"t":"p","x":"Exercise B — Recover"},{"t":"p","x":"Choose two of the examples."},{"t":"p","x":"Halfway through each answer, deliberately pause and say:"},{"t":"q","x":"“Let me put that another way.”"},{"t":"p","x":"Then continue with a simpler explanation."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Choose a topic you know well."},{"t":"p","x":"Explain it for one minute without notes."},{"t":"p","x":"If you get stuck:"},{"t":"ol","n":1,"x":"Pause."},{"t":"ol","n":2,"x":"Identify the point you were trying to make."},{"t":"ol","n":3,"x":"Use a recovery phrase."},{"t":"ol","n":4,"x":"Continue."},{"t":"p","x":"Repeat the explanation once, aiming to make it clearer rather than more elaborate."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"What do I normally do when I cannot find a word?"},{"t":"li","x":"Did I recover rather than ramble?"},{"t":"li","x":"Which recovery phrase felt most natural?"},{"t":"p","x":"Today's takeaway: “I don't need the perfect word to keep communicating.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"If you lose a word or stumble over a sentence today, pause and explain the idea another way instead of rushing to rescue the original sentence."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-22","kind":"day","n":14,"label":"Day 14","title":"Three Levels: 20 Seconds, 60 Seconds, 2 Minutes","intro":[{"t":"p","x":"Today's goal: Control how much you say without losing the main point."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a familiar subject, such as your job, a hobby or a recent event."},{"t":"p","x":"Explain it in one sentence."},{"t":"p","x":"Now explain it in three sentences."},{"t":"p","x":"Notice how you can communicate the same basic idea at different levels of detail."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"A good communicator doesn't give the same-length answer to every question."},{"t":"p","x":"Sometimes the listener needs a quick answer. Sometimes they want an explanation. Sometimes they need the full picture."},{"t":"p","x":"Your job is to choose the appropriate level of detail."},{"t":"p","x":"Think of three versions:"},{"t":"li","x":"20 seconds: The headline and essential point."},{"t":"li","x":"60 seconds: The point plus the reason and one example."},{"t":"li","x":"2 minutes: A fuller explanation, including relevant context and consequences."},{"t":"p","x":"The longer version should add useful detail, not simply repeat the same idea in more words."}]},{"title":"Speaking drill","mins":"6–7 min","blocks":[{"t":"p","x":"Choose one subject. Good options include:"},{"t":"li","x":"What you do in your job."},{"t":"li","x":"A project you're working on."},{"t":"li","x":"A hobby you enjoy."},{"t":"li","x":"A place you've visited."},{"t":"li","x":"Something you believe makes life better."},{"t":"p","x":"Explain the same subject at all three lengths."},{"t":"p","x":"Round 1 — 20 seconds"},{"t":"p","x":"Give only the essential message."},{"t":"p","x":"Round 2 — 60 seconds"},{"t":"p","x":"Add the main reason and an example."}]},{"title":"Round 3","mins":"2 min","blocks":[{"t":"p","x":"Develop the explanation with relevant background, a specific detail and a conclusion."},{"t":"p","x":"If you finish before the time is up, don't add filler. Finish naturally and use the remaining time to prepare the next version."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Choose a current work topic."},{"t":"p","x":"Imagine three listeners:"},{"t":"ol","n":1,"x":"A busy senior manager."},{"t":"ol","n":2,"x":"A colleague who needs to understand the issue."},{"t":"ol","n":3,"x":"Someone who needs the full explanation to make a decision."},{"t":"p","x":"Give each version aloud."},{"t":"p","x":"For the senior manager, lead with the outcome or decision."},{"t":"p","x":"For the colleague, explain the reasoning."},{"t":"p","x":"For the person making the decision, include the relevant detail and consequences."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"What detail did I remove from the 20-second version?"},{"t":"li","x":"What did I add to the two-minute version?"},{"t":"li","x":"Did the main point remain the same?"},{"t":"li","x":"Did I add detail because it was useful or simply because I had more to say?"},{"t":"p","x":"Today's takeaway: “I can change the length without losing the message.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Before explaining something at work, consider how much detail the listener actually needs. Start with the short version and expand if necessary."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-23","kind":"day","n":15,"label":"Day 15","title":"Answer the Actual Question","intro":[{"t":"p","x":"Today's goal: Listen to the question, identify what is being asked, and answer that question directly."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Read these questions aloud:"},{"t":"li","x":"“What happened?”"},{"t":"li","x":"“Why did it happen?”"},{"t":"li","x":"“What should we do?”"},{"t":"li","x":"“When will it be finished?”"},{"t":"li","x":"“What do you recommend?”"},{"t":"p","x":"Give a one-sentence answer to each."},{"t":"p","x":"Notice that each question asks for something different."}]},{"title":"Today's skill","mins":"3 min","blocks":[{"t":"p","x":"Sometimes a question contains background, several details or an expression of concern. It's easy to respond to the general topic rather than the actual question."},{"t":"p","x":"Before answering, silently ask:"},{"t":"q","x":"“What are they actually asking me?”"},{"t":"p","x":"Identify whether they want:"},{"t":"li","x":"A fact."},{"t":"li","x":"An explanation."},{"t":"li","x":"A recommendation."},{"t":"li","x":"A decision."},{"t":"li","x":"Reassurance."},{"t":"li","x":"A next step."},{"t":"p","x":"Answer that first. Add supporting detail only when it helps."},{"t":"p","x":"For example:"},{"t":"p","x":"Question: “Given the testing delays and the supplier issue, do you think we can still deliver by Friday?”"},{"t":"p","x":"Less direct answer: “Well, we've had a few problems with testing, and the supplier has been slow…”"},{"t":"p","x":"More direct answer: “Friday is possible, but it's at risk because of the supplier delay.”"},{"t":"p","x":"Now the listener knows your position. You can explain the details afterwards."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer these five questions."},{"t":"p","x":"Before each answer, pause for two seconds and silently identify the actual question."},{"t":"p","x":"Question 1: “What is the biggest risk to the project?”"},{"t":"p","x":"Answer with the main risk."},{"t":"p","x":"Question 2: “Why has the work fallen behind?”"},{"t":"p","x":"Give the cause, not a full history of the project."},{"t":"p","x":"Question 3: “What would you recommend?”"},{"t":"p","x":"Give your recommendation first."},{"t":"p","x":"Question 4: “Can you finish this by Friday?”"},{"t":"p","x":"Give a clear yes, no or qualified answer."},{"t":"p","x":"Question 5: “What do you need from me?”"},{"t":"p","x":"State the specific help or decision required."},{"t":"p","x":"Allow about 45–60 seconds for each, including a brief pause before answering."}]},{"title":"Real-life application","mins":"4–5 min","blocks":[{"t":"p","x":"Think of a recent meeting or conversation in which you explained a lot but may not have answered the question directly."},{"t":"p","x":"Reconstruct the exchange."},{"t":"p","x":"Ask yourself:"},{"t":"ol","n":1,"x":"What did the person actually want to know?"},{"t":"ol","n":2,"x":"What did I answer instead?"},{"t":"ol","n":3,"x":"What would a direct first sentence have sounded like?"},{"t":"p","x":"Now role-play the exchange aloud."},{"t":"p","x":"Give the direct answer first, followed by one reason or example if necessary."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Did I identify the question before answering?"},{"t":"li","x":"Did I answer directly in my first sentence?"},{"t":"li","x":"Did I confuse explaining the background with answering the question?"},{"t":"li","x":"What will I do differently next time?"},{"t":"p","x":"Today's takeaway: “Answer the question first. Explain only what is needed.”"}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In a meeting today, answer the question that was asked — not the question you prepared for."},{"t":"p","x":"If the question is unclear, ask:"},{"t":"q","x":"“Do you mean the current status, or whether I think we'll meet the deadline?”"},{"t":"p","x":"Clarifying the question is better than giving a long answer to the wrong one."}]},{"title":"Week 3 — End-of-week review","mins":null,"blocks":[{"t":"p","x":"Allow 5 minutes on Friday if you have time, or use this as a brief reflection after the daily session."},{"t":"p","x":"Look back at the five skills:"},{"t":"li","x":"Answer First."},{"t":"li","x":"Five-Second Start."},{"t":"li","x":"Finding Words."},{"t":"li","x":"Three Levels."},{"t":"li","x":"Answer the Actual Question."},{"t":"p","x":"Complete these sentences:"},{"t":"p","x":"The skill that came most naturally was…"},{"t":"p","x":"The skill I found most difficult was…"},{"t":"p","x":"One thing I noticed about how I speak is…"},{"t":"p","x":"One thing I will practise in real conversations next week is…"},{"t":"p","x":"This week's key lesson"},{"t":"p","x":"You don't need to think of the whole answer before you start speaking."},{"t":"p","x":"You need to know your first point, begin simply, and develop the thought in manageable pieces."},{"t":"q","x":"Start with the point. Keep going one thought at a time. Recover when needed. Stop when you've answered."},{"t":"p","x":"That's how you make spontaneous speaking clearer, calmer and more natural."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":3,"weekName":"Thinking while speaking","weekIntro":[{"t":"p","x":"This week's focus"},{"t":"p","x":"You often have good ideas, but sometimes it takes you a while to formulate them. You may start explaining before you've decided what your main point is, use a long sentence, or lose track of where you were going."},{"t":"p","x":"This week is about becoming more comfortable thinking and speaking at the same time. You will practise answering promptly, starting before you have the perfect words, recovering when a sentence goes wrong, and adjusting the length of your answer to suit the situation."},{"t":"p","x":"You are not aiming to speak quickly or without thinking. You are aiming to make a reasonable start, organise your thoughts as you go, and keep the listener with you."},{"t":"p","x":"Remember: You don't need the perfect sentence. You need a clear first sentence."}],"g":3},{"date":"2026-10-26","kind":"day","n":16,"label":"Day 16","title":"Strong Openings","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say aloud three times: “My main point is…” Follow it with a clear, one-sentence point. Pause and finish firmly."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Point → Reason → Example."},{"t":"p","x":"Instead of: “I was looking at the project, and there are a few things that might be worth considering…”"},{"t":"p","x":"Say: “We need to review the project timeline. Testing is taking longer than expected.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose three work topics. For each one:"},{"t":"li","x":"State your main point in one sentence."},{"t":"li","x":"Give one reason."},{"t":"li","x":"Add an example if needed."},{"t":"li","x":"Stop and pause."},{"t":"p","x":"Repeat your clearest answer, making the first sentence more direct."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Prepare a 30-second contribution to a meeting. Start with your main point, support it with one reason and finish clearly. Practise twice, using shorter sentences the second time."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Did I get to the point quickly? Was my first sentence clear? Did I finish confidently?"},{"t":"p","x":"Today’s takeaway: Lead with the point, not the background."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Start one real conversation or work contribution with your main point."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-27","kind":"day","n":17,"label":"Day 17","title":"Don’t Give Away the Floor","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say three short statements aloud. After each, pause briefly without trailing off or looking as though you have finished speaking."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Your voice can drop at the end of a sentence, making others think you have finished. Keep the final words audible and deliberate. When you have more to say, use a linking phrase such as “The other point is…”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Practise these phrases:"},{"t":"li","x":"“There’s one important point.”"},{"t":"li","x":"“The reason I say that is…”"},{"t":"li","x":"“The second issue is…”"},{"t":"li","x":"“What I recommend is…”"},{"t":"p","x":"After each opening, continue with a complete thought. Keep your voice steady and finish each sentence clearly."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Explain a work issue in three short sentences. Pause between sentences, but make it clear you are continuing. Finish with a definite conclusion, such as: “That’s why I recommend delaying the decision.”"}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Did my voice remain audible at the end? Did I signal when I had more to say? Did I finish deliberately?"},{"t":"p","x":"Today’s takeaway: A pause does not have to mean you have finished."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In one conversation, keep the floor long enough to complete your point instead of letting your voice fade or stopping mid-thought."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-28","kind":"day","n":18,"label":"Day 18","title":"Handling Interruptions","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say aloud, calmly and clearly:"},{"t":"li","x":"“Let me finish that point.”"},{"t":"li","x":"“Just to complete the thought…”"},{"t":"li","x":"“I’ll come to that in a moment.”"},{"t":"p","x":"Repeat each phrase twice without sounding aggressive."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"When interrupted, you do not have to compete by speaking louder or faster. Briefly acknowledge the other person, then return to your point."},{"t":"p","x":"Use: Acknowledge → Return → Finish."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Practise responding to these imagined interruptions:"},{"t":"li","x":"“But what about the cost?”"},{"t":"li","x":"“We tried that before.”"},{"t":"li","x":"“Can I just ask something?”"},{"t":"p","x":"Acknowledge each interruption briefly, then say, “The point I was making is…” and finish your original thought in one or two sentences."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Imagine a meeting where you need to explain a project risk. Speak for 30 seconds. Pause at a planned point and imagine someone interrupts."},{"t":"p","x":"Respond calmly, return to your main message and finish with your recommendation. Repeat twice, keeping your answer concise."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Did I stay calm? Did I return to my original point? Did I avoid overexplaining?"},{"t":"p","x":"Today’s takeaway: You can acknowledge an interruption without abandoning your point."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"If interrupted today, calmly return to your main point and complete it."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-29","kind":"day","n":19,"label":"Day 19","title":"Disagreeing Clearly","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say each phrase aloud:"},{"t":"li","x":"“I see it differently.”"},{"t":"li","x":"“I understand that concern, but…”"},{"t":"li","x":"“My main concern is…”"},{"t":"li","x":"“I recommend another approach.”"},{"t":"p","x":"Keep your tone calm and your sentences short."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Acknowledge → Disagree → Reason → Alternative."},{"t":"p","x":"Example: “I understand why we want to release this week. My concern is that testing is incomplete. I recommend waiting until Friday.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Practise disagreeing with these statements:"},{"t":"li","x":"“We don’t need more testing.”"},{"t":"li","x":"“We should make the decision now.”"},{"t":"li","x":"“The current process is good enough.”"},{"t":"p","x":"For each one, acknowledge the view, state your concern, give one reason and suggest an alternative."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a real or imagined work disagreement. Deliver your response in three or four sentences. Repeat it, removing unnecessary qualifications such as “I might be wrong, but perhaps…”"},{"t":"p","x":"Be respectful without hiding your position."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself: Was my position clear? Did I explain why? Did I offer a constructive alternative?"},{"t":"p","x":"Today’s takeaway: Respectful disagreement can be direct. You do not need to bury your point in apologies or qualifications."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"State one genuine preference or concern clearly today, while acknowledging the other person’s perspective."}]}],"month":1,"monthName":"Clear speech, clear sentences and being heard","week":4,"weekName":"Holding the Floor","weekIntro":[{"t":"p","x":"Weekly objective: Speak with a clear opening, hold your turn, handle interruptions and disagree respectfully."},{"t":"p","x":"Core principle: Make your point early. Speak in short sentences. Finish clearly."}],"g":4},{"date":"2026-10-30","kind":"day","n":20,"label":"Day 20","title":"Month 1 Test","intro":[{"t":"p","x":"Weekly objective: Bring together clear openings, short sentences, audible endings and the ability to hold your turn."}],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say: “My main point is…” Then give a clear point about a work topic. Repeat with a different topic."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Remember the four habits from Month 1:"},{"t":"li","x":"One thought per sentence."},{"t":"li","x":"Pause between thoughts."},{"t":"li","x":"Keep the end of each sentence audible."},{"t":"li","x":"State the main point early."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Record yourself answering these three questions:"},{"t":"ol","n":1,"x":"What is an important issue in your work?"},{"t":"ol","n":2,"x":"What do you recommend?"},{"t":"ol","n":3,"x":"Why do you recommend it?"},{"t":"p","x":"Speak for approximately 30–45 seconds per answer. Use short sentences and finish each answer clearly."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose one answer and repeat it, improving the weakest part of your delivery. Then practise an interruption: pause, acknowledge the imagined speaker, return to your point and finish."},{"t":"p","x":"If you attend Toastmasters or have a work meeting coming up, choose one habit to practise there."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Score yourself from 1 to 5 on:"},{"t":"li","x":"Clear opening."},{"t":"li","x":"Short sentences."},{"t":"li","x":"Audible sentence endings."},{"t":"li","x":"Holding the floor."},{"t":"li","x":"Direct, respectful disagreement."},{"t":"p","x":"Write down one improvement and one skill to continue practising."},{"t":"p","x":"Today’s takeaway: Being heard starts with making your message easy to follow and making it clear when you have more to say."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use one Month 1 skill in a real conversation today."}]},{"title":"Week 4 review","mins":null,"blocks":[{"t":"p","x":"Ask yourself:"},{"t":"li","x":"Do I get to the point more quickly?"},{"t":"li","x":"Do I finish sentences clearly?"},{"t":"li","x":"Can I hold my turn without rushing?"},{"t":"li","x":"Can I return to my point after an interruption?"},{"t":"li","x":"Can I disagree without hiding my position?"}]},{"title":"Toastmasters connection","min speaking","week":5,"weekName":"Direct Answers","weekIntro":[{"t":"p","x":"Weekly objective: Give your main point first, then add only the explanation needed. This will help you communicate more clearly in meetings and everyday conversations."},{"t":"p","x":"Core principle: Answer first. Explain second. Stop when you have said enough."}],"g":5},{"date":"2026-11-03","kind":"day","n":22,"label":"Day 22","title":"Thirty Seconds","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Explain a familiar subject for 20 seconds. Repeat in 10 seconds, removing unnecessary information rather than speaking faster."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Practise three levels:"},{"t":"li","x":"10 seconds: Main answer."},{"t":"li","x":"20 seconds: Answer plus reason."},{"t":"li","x":"30 seconds: Add one example or qualification."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer these questions in 10, 20 and 30 seconds:"},{"t":"li","x":"What are you working on?"},{"t":"li","x":"What is the main problem?"},{"t":"li","x":"What do you recommend?"},{"t":"p","x":"Make each version understandable on its own. The longer versions should add useful detail, not repeat the same point."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a current work issue. Explain what is happening, why it matters and what should happen next in 30 seconds. Then reduce it to a 10-second headline and expand it again when imagining a follow-up question."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Could I give a short, complete answer? Did the extra detail add value? Did I avoid repeating myself?"},{"t":"p","x":"Today’s takeaway: Start concise; expand when the listener needs more."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Give one answer in about 30 seconds, then stop and allow questions."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":5,"weekName":"Direct Answers","weekIntro":[{"t":"p","x":"Weekly objective: Give your main point first, then add only the explanation needed. This will help you communicate more clearly in meetings and everyday conversations."},{"t":"p","x":"Core principle: Answer first. Explain second. Stop when you have said enough."}],"g":5},{"date":"2026-11-04","kind":"day","n":23,"label":"Day 23","title":"Add the Reason","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Complete these phrases aloud: “I recommend this because…”, “The main reason is…” and “This matters because…”"}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Point → Reason."},{"t":"p","x":"Example: “We should test the change before release because it affects a function other teams rely on.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Give a clear reason for each statement:"},{"t":"li","x":"We should postpone the meeting."},{"t":"li","x":"We need more testing."},{"t":"li","x":"We should simplify the process."},{"t":"p","x":"State the point, pause, give one specific reason and stop. Repeat your clearest answer."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose two recent work decisions. For each, state your recommendation and explain why it makes sense. Keep each explanation to two or three sentences."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Was my reason specific? Did it support my point? Did I stop when I had explained enough?"},{"t":"p","x":"Today’s takeaway: One good reason can make your answer clearer and more convincing."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Make one recommendation today and support it with a concrete reason."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":5,"weekName":"Direct Answers","weekIntro":[{"t":"p","x":"Weekly objective: Give your main point first, then add only the explanation needed. This will help you communicate more clearly in meetings and everyday conversations."},{"t":"p","x":"Core principle: Answer first. Explain second. Stop when you have said enough."}],"g":5},{"date":"2026-11-05","kind":"day","n":24,"label":"Day 24","title":"Add the Example","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say: “Clear instructions save time.” Add a concrete example that shows why. Repeat with another opinion."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Point → Reason → Example."},{"t":"p","x":"Example: “We should simplify the reporting process. It takes too much time. The team currently enters the same information into two systems.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain three topics: effective meetings, early testing and clear technical explanations. For each, state the point, explain why it matters and give one specific example."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a technical concept you often explain. Describe what it does, why it matters and when someone might encounter it. Imagine you are explaining it to a senior manager; focus on the practical impact rather than technical detail."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did my example make the idea easier to understand? Was it specific? Did I avoid unnecessary detail?"},{"t":"p","x":"Today’s takeaway: A concrete example helps people picture what you mean."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Include one short example when explaining something at work today."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":5,"weekName":"Direct Answers","weekIntro":[{"t":"p","x":"Weekly objective: Give your main point first, then add only the explanation needed. This will help you communicate more clearly in meetings and everyday conversations."},{"t":"p","x":"Core principle: Answer first. Explain second. Stop when you have said enough."}],"g":5},{"date":"2026-11-06","kind":"day","n":25,"label":"Day 25","title":"Work Answers — Weekly Review","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say aloud: “My recommendation is…”, “The reason is…” and “For example…” Pause between each phrase and finish clearly."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Bring the week together:"},{"t":"p","x":"Headline → Reason → Example → Stop"},{"t":"p","x":"You do not need all four parts every time. Use what the question requires."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer these questions in no more than 30 seconds each:"},{"t":"li","x":"What is the current status?"},{"t":"li","x":"What is the biggest risk?"},{"t":"li","x":"What do you recommend?"},{"t":"p","x":"Then answer: “Why?” and “Can you give me an example?” directly, without repeating your whole explanation."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a real work issue. Give a one-minute explanation using the four-part structure. Then practise answering two follow-up questions in one or two sentences each."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Score yourself from 1 to 5 on giving the headline first, keeping sentences short, explaining your reason, using examples and finishing clearly."},{"t":"p","x":"Today’s takeaway: A direct answer gives people a clear starting point; reasons and examples help them understand it."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use the week’s structure in one genuine work conversation."}]},{"title":"Week 5 review","mins":null,"blocks":[{"t":"li","x":"Do I start with the answer rather than the background?"},{"t":"li","x":"Can I explain an issue in 30 seconds?"},{"t":"li","x":"Do I give clear reasons and useful examples?"}]},{"title":"Toastmasters connection","mins":null,"blocks":[{"t":"p","x":"Notice how experienced speakers answer questions. Listen for who gives the main point first."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":5,"weekName":"Direct Answers","weekIntro":[{"t":"p","x":"Weekly objective: Give your main point first, then add only the explanation needed. This will help you communicate more clearly in meetings and everyday conversations."},{"t":"p","x":"Core principle: Answer first. Explain second. Stop when you have said enough."}],"g":5},{"date":"2026-11-09","kind":"day","n":26,"label":"Day 26","title":"Two Points","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say: “There are two things worth mentioning.” Give two short points about your work or day, pausing between them."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Headline → Point 1 → Point 2."},{"t":"p","x":"Example: “The project is progressing well. The main concern is the testing schedule.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain three topics using exactly two points: a project’s progress, what makes a good meeting, and something you enjoy. Give a headline, state each point separately and finish."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Prepare a 30–45 second explanation of a current work issue. Use two points only. If you are interrupted, answer briefly and return to your second point."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Were the points distinct? Did I finish one before starting the next? Did I avoid adding extra thoughts?"},{"t":"p","x":"Today’s takeaway: Two clear points are better than several loosely connected ones."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use “There are two things to consider” in a real conversation."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-10","kind":"day","n":27,"label":"Day 27","title":"Three Points","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Say: “There are three things to consider.” Give three short points about a familiar subject."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Headline → First → Second → Third → Conclusion."},{"t":"p","x":"Example: “We need to finish testing, confirm support arrangements and agree the release date. Once those are complete, we can make a reliable decision.”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain how to prepare for a meeting, reduce project risk and make a presentation clearer. Choose three points before speaking and summarise them at the end."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Write three keywords about a current work issue. Use them to speak for one minute without a script. Finish with a recommendation or next step."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did I know my points before speaking? Were they easy to distinguish? Did my conclusion connect them?"},{"t":"p","x":"Today’s takeaway: A simple structure gives your thoughts somewhere to go."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Explain one work issue using three clearly separated points."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-11","kind":"day","n":28,"label":"Day 28","title":"Signposting","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Practise these phrases aloud:"},{"t":"li","x":"“The main point is…”"},{"t":"li","x":"“The second issue is…”"},{"t":"li","x":"“The practical consequence is…”"},{"t":"li","x":"“My recommendation is…”"},{"t":"p","x":"Pause briefly after each opening."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use signposts to show listeners where you are in your explanation. Introduce the main point, mark an important change and signal the conclusion."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose three work topics. For each, speak for about 45 seconds using a clear opening, two signposted points and a concluding sentence."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Explain a technical issue to an imaginary manager. Use “The main issue is…”, “The reason is…” and “What I recommend is…”. Then explain something you enjoyed using the same structure."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did the structure sound clear? Were the signposts useful? Did I finish decisively?"},{"t":"p","x":"Today’s takeaway: Signposting helps listeners follow your thinking and helps you keep your place."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use a signpost to introduce your main point and another to introduce your recommendation."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-12","kind":"day","n":29,"label":"Day 29","title":"Verbal Mind Map","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Name a familiar topic, then give three related keywords. Say one sentence about each."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use this quick planning method:"},{"t":"ol","n":1,"x":"Centre: What is the subject?"},{"t":"ol","n":2,"x":"Branches: What are the two or three key aspects?"},{"t":"ol","n":3,"x":"Message: What should the listener understand or do?"},{"t":"p","x":"Prepare keywords, not a complete script."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose a work topic, a skill you have developed and a personal interest. For each, take 20 seconds to choose three keywords, then speak for 45 seconds using them as prompts."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a work issue and write no more than five keywords, such as Problem → Cause → Risk → Options → Recommendation. Speak for one minute, then repeat using only three keywords."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did the keywords help me stay on track? Did I avoid scripting every sentence? Did I leave out unnecessary details?"},{"t":"p","x":"Today’s takeaway: Prepare the route, not every word of the journey."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Use three mental keywords before making a contribution in a meeting."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-13","kind":"day","n":30,"label":"Day 30","title":"One-Minute Explanation — Weekly Review","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Explain a familiar topic in 20 seconds. Repeat with a headline, two or three points and a clear ending."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use this one-minute structure:"},{"t":"li","x":"Opening: State the main point."},{"t":"li","x":"Middle: Explain two or three supporting points."},{"t":"li","x":"Ending: Give an example, recommendation or conclusion."},{"t":"p","x":"The structure is a guide, not a script."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose a technical topic, a work decision and a personal interest. For each, prepare three keywords and speak for one minute. If you lose your thread, pause and continue from your next keyword."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Give a one-minute explanation of a genuine work issue. Then answer “Why does that matter?” and “What should happen next?” in one or two sentences each."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Score yourself from 1 to 5 on clear opening, logical order, short sentences, staying on topic and clear ending. Identify one improvement."},{"t":"p","x":"Today’s takeaway: A little structure helps you speak naturally without formulating every sentence in advance."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Give one genuine one-minute explanation using keywords rather than a script."}]},{"title":"Week 6 review","mins":null,"blocks":[{"t":"li","x":"Can I organise an explanation into two or three points?"},{"t":"li","x":"Do signposts help me maintain my thread?"},{"t":"li","x":"Can I recover when I lose my place?"},{"t":"li","x":"Can I speak from keywords rather than a script?"}]},{"title":"Toastmasters connection","mins":null,"blocks":[{"t":"p","x":"Notice how speakers organise their openings, supporting points and conclusions. Try a headline followed by two points when you contribute to a discussion."}]},{"title":"Looking ahead","mins":null,"blocks":[{"t":"p","x":"Week 7 focuses on recovering when you lose your thread, simplifying ideas and answering unexpected questions without rambling."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":6,"weekName":"Structuring Your Thoughts","weekIntro":[{"t":"p","x":"Weekly objective: Organise your thoughts while speaking so you can explain complex ideas without rambling or losing your thread."},{"t":"p","x":"Core principle: Choose the structure before adding the detail."}],"g":6},{"date":"2026-11-16","kind":"day","n":31,"label":"Day 31","title":"Lost Thread","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Speak for 30 seconds about a familiar topic. Pause deliberately halfway through, then continue with your next point."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"When you lose your thread, do not rush or restart. Pause and ask yourself: “What is the main point I want to make?”"}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain three familiar topics for 30 seconds each. Deliberately pause once during each explanation. Resume with “The main point is…” or “What matters here is…”"}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Explain a work issue using three keywords. If you lose your place, pause, look at the keywords and continue with the next point. Repeat using a different topic."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did I recover without rushing? Did I return to the main point?"},{"t":"p","x":"Today’s takeaway: Losing your thread is manageable; you do not need to start again."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"If you lose your place today, pause and resume with your main point."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":7,"weekName":"Recovering Your Thread","weekIntro":[{"t":"p","x":"Weekly objective: Stay focused when you lose your words, simplify your explanation and recover calmly from unexpected questions."},{"t":"p","x":"Core principle: Pause. Find the main point. Continue from there."}],"g":7},{"date":"2026-11-17","kind":"day","n":32,"label":"Day 32","title":"Simplify","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Explain a familiar technical concept in one sentence. Repeat it using simpler words."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Idea → Plain-language explanation → Example. Aim to make the idea easier to understand, not to prove how much you know."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose three technical terms you use at work. Explain each without jargon, then add one example. Keep each explanation to two sentences."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Explain a current work issue as if speaking to a colleague outside IT. Focus on what is happening, why it matters and what needs to happen next."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Was the explanation simple without being inaccurate? Could someone unfamiliar with the topic follow it?"},{"t":"p","x":"Today’s takeaway: Clarity often comes from removing detail, not adding it."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Replace one technical explanation today with a plain-language version."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":7,"weekName":"Recovering Your Thread","weekIntro":[{"t":"p","x":"Weekly objective: Stay focused when you lose your words, simplify your explanation and recover calmly from unexpected questions."},{"t":"p","x":"Core principle: Pause. Find the main point. Continue from there."}],"g":7},{"date":"2026-11-18","kind":"day","n":33,"label":"Day 33","title":"Don’t Chase Every Thought","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a topic and name three related ideas. Select the most important one and speak about it for 20 seconds."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Not every thought needs to be spoken. Ask: “Does this help answer the question or explain my main point?” If not, leave it out."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer three questions in 30 seconds each. When a new thought occurs, stay with your original answer unless the new idea is essential. Finish with a clear concluding sentence."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Choose a work question. Give a direct answer, one reason and one example. Resist adding extra background or unrelated qualifications."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did I stay on topic? Which detail could I have left out?"},{"t":"p","x":"Today’s takeaway: A useful answer is selective, not exhaustive."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In one conversation, leave out a detail that does not help your main point."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":7,"weekName":"Recovering Your Thread","weekIntro":[{"t":"p","x":"Weekly objective: Stay focused when you lose your words, simplify your explanation and recover calmly from unexpected questions."},{"t":"p","x":"Core principle: Pause. Find the main point. Continue from there."}],"g":7},{"date":"2026-11-19","kind":"day","n":34,"label":"Day 34","title":"Unexpected Question","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Ask yourself three spontaneous questions about work or everyday life. Answer each in one sentence."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use Point → Reason → Example. Take a brief pause before answering; you do not need to respond instantly."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Answer questions such as “What would you change?”, “What concerns you most?” and “What would you recommend?” Keep each answer to two or three sentences."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Imagine a manager asks a question you did not prepare {"title":"Week 7 review","mins":null,"blocks":[{"t":"p","x":"Can you recover when you lose your thread? Are you leaving out unnecessary detail? Are your answers more direct?"}]}],"month":2,"monthName":"Thinking clearly while speaking","week":7,"weekName":"Recovering Your Thread","weekIntro":[{"t":"p","x":"Weekly objective: Stay focused when you lose your words, simplify your explanation and recover calmly from unexpected questions."},{"t":"p","x":"Core principle: Pause. Find the main point. Continue from there."}],"g":7},{"date":"2026-11-23","kind":"day","n":36,"label":"Day 36","title":"Technical Explanation","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a technical concept you know well. Explain it in one sentence."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"A technical explanation should be accurate and organised. Use What it is → How it works → Why it matters."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Explain one technical system or process in three stages. Keep each stage to one or two sentences and use precise terms where they genuinely help."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Prepare a one-minute explanation for a technically knowledgeable colleague. Include the key mechanism, the issue and the consequence. Avoid irrelevant background."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Was I accurate? Was the order logical? Did every detail serve the explanation?"},{"t":"p","x":"Today’s takeaway: Technical accuracy works best when the explanation has a clear structure."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"Give a colleague a structured technical explanation instead of a long stream of detail."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":8,"weekName":"Explaining for Your Audience","weekIntro":[{"t":"p","x":"Weekly objective: Explain the same idea differently depending on the listener’s knowledge, role and needs."},{"t":"p","x":"Core principle: Keep the meaning; adapt the explanation."}],"g":8},{"date":"2026-11-24","kind":"day","n":37,"label":"Day 37","title":"Senior Manager Version","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Take a technical issue and state its business impact in one sentence."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Senior managers often need the impact, risk and decision, rather than the full technical mechanism."}]},{"title":"Speaking drill","mins":"6 min","blocks":[{"t":"p","x":"Choose a work issue. Explain what is happening, what it means for time, cost, risk or service, and what decision is needed."}]},{"title":"Real-life application","mins":"6 min","blocks":[{"t":"p","x":"Deliver a 45-second update as if speaking to a senior manager. Lead with the headline, state the impact and finish with your recommendation."}]},{"title":"Quick review","mins":"2 min","blocks":[{"t":"p","x":"Did I focus on the decision and consequences? Did I avoid unnecessary technical detail?"},{"t":"p","x":"Today’s takeaway: Adapt the detail to the decision the listener needs to make."}]},{"title":"Real-world challenge","mins":null,"blocks":[{"t":"p","x":"In a work update, lead with the business impact before explaining the technical cause."}]}],"month":2,"monthName":"Thinking clearly while speaking","week":8,"weekName":"Explaining for Your Audience","weekIntro":[{"t":"p","x":"Weekly objective: Explain the same idea differently depending on the listener’s knowledge, role and needs."},{"t":"p","x":"Core principle: Keep the meaning; adapt the explanation."}],"g":8},{"date":"2026-11-25","kind":"day","n":38,"label":"Day 38","title":"Nontechnical Version","intro":[],"tasks":[{"title":"Warm-up","mins":"2 min","blocks":[{"t":"p","x":"Choose a technical term and explain it without using the term itself."}]},{"title":"Today’s skill","mins":"2 min","blocks":[{"t":"p","x":"Use
