<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC514"/>
      <stop offset="1" stop-color="#FF5A36"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E99A3"/>
      <stop offset=".28" stop-color="#F7FAFC"/>
      <stop offset=".55" stop-color="#C3CCD4"/>
      <stop offset="1" stop-color="#6F7A85"/>
    </linearGradient>
    <clipPath id="rr"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="cap"><rect x="168" y="62" width="176" height="244" rx="88"/></clipPath>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sunburst rays -->
    <g fill="#FFFFFF" opacity=".16" transform="translate(256 206)">
      <path d="M0 0 L-60 -420 L60 -420Z"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(40)"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(80)"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(120)"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(160)"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(200)"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(240)"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(280)"/>
      <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(320)"/>
    </g>
    <circle cx="256" cy="206" r="150" fill="#FFE27A" opacity=".35"/>

    <!-- stand: stem + base -->
    <rect x="236" y="338" width="40" height="96" fill="url(#chrome)"/>
    <ellipse cx="256" cy="448" rx="92" ry="20" fill="#7A2A12" opacity=".35"/>
    <path d="M160 440 Q160 410 200 410 L312 410 Q352 410 352 440 L352 452 Q352 466 336 466 L176 466 Q160 466 160 452Z" fill="url(#chrome)" stroke="#4B5560" stroke-width="6"/>

    <!-- yoke (U-shaped holder) -->
    <path d="M140 196 L140 262 Q140 346 256 346 Q372 346 372 262 L372 196" fill="none" stroke="#2B333B" stroke-width="22" stroke-linecap="round"/>
    <path d="M140 196 L140 262 Q140 346 256 346 Q372 346 372 262 L372 196" fill="none" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round"/>

    <!-- capsule -->
    <rect x="168" y="62" width="176" height="244" rx="88" fill="url(#chrome)" stroke="#2B333B" stroke-width="10"/>
    <g clip-path="url(#cap)" stroke="#2B333B" stroke-width="9" opacity=".8">
      <line x1="150" y1="110" x2="362" y2="110"/>
      <line x1="150" y1="146" x2="362" y2="146"/>
      <line x1="150" y1="182" x2="362" y2="182"/>
      <line x1="150" y1="218" x2="362" y2="218"/>
      <line x1="150" y1="254" x2="362" y2="254"/>
    </g>
    <!-- shine -->
    <path d="M200 110 Q200 82 224 74" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity=".85"/>
    <!-- collar bands -->
    <rect x="164" y="296" width="184" height="28" rx="10" fill="#2B333B"/>
    <rect x="172" y="301" width="168" height="8" rx="4" fill="#C3CCD4"/>
  </g>
</svg>
